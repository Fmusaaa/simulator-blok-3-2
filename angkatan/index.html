sis.",""],["Hiperkortisolism","Kadar.",""],["Cushing syndrome","Benar: Cushing syndrome eksogen.",""],["ACTH ectopic","Ektopik.",""],["Addison disease","Kebalikan.",""]],"a":2,"v":2,"r":2,"p":"","k":"","t":"","n":"","tag":"asli","lbl":"SOAL ASLI · UAS Calcaneus","no":"96","ord":96},{"id":349,"ppt":"cal-uas","topik":"Onkologi & petanda tumor","s":"Perempuan, 25 tahun datang dengan keluhan benjolan pada perut bawah kiri. Karena benjolan sangat besar dilakukan operasi. Pada waktu operasi tumor dibelah, didapatkan struktur gigi dan rambut. Apakah diagnosis yang paling sesuai ?","o":[["Pleomorfik adenoma","Kelenjar liur.",""],["Teratoma kistik","Benar: teratoma kistik.",""],["Melanoma","Melanosit.",""],["Limfoma","Limfoid.",""],["Mesotelioma","Mesotel.",""]],"a":1,"v":1,"r":1,"p":"","k":"","t":"","n":"","tag":"asli","lbl":"SOAL ASLI · UAS Calcaneus","no":"97","ord":97},{"id":350,"ppt":"cal-uas","topik":"Diabetes melitus","s":"Hemoglobin A1c (HbA1c) merupakan glukosa yang berikatan dengan hemoglobin secara ireversibel. HbA1c dapat mencerminkan keadaan kontrol gula darah pasien selama berapa lama ?","o":[["Dua minggu","Fruktosamin.",""],["Satu bulan","Tidak.",""],["Dua bulan","Tidak.",""],["Tiga bulan","Benar: 3 bulan.",""],["Empat bulan","Tidak.",""]],"a":3,"v":3,"r":3,"p":"","k":"","t":"","n":"","tag":"asli","lbl":"SOAL ASLI · UAS Calcaneus","no":"98","ord":98},{"id":351,"ppt":"cal-uas","topik":"Diabetes melitus","s":"Antidiabetik ini diketahui dapat menurunkan berat badan dan meminimalkan penambahan berat badan. Apakah obat yang dimaksud?","o":[["Glibenclamide","Menaikkan BB.",""],["Dapagliflozin","Benar: dapagliflozin (SGLT-2i) menurunkan BB.",""],["Gliburid","Menaikkan BB.",""],["Nateglinid","Menaikkan BB.",""],["Acarbose","Netral.",""]],"a":1,"v":1,"r":1,"p":"","k":"","t":"","n":"Nomor 99–106 kosong di file angkatan.","tag":"asli","lbl":"SOAL ASLI · UAS Calcaneus","no":"107","ord":107}]}</script>
<script>
(function(){
"use strict";
var BANK=JSON.parse(document.getElementById("bank").textContent);
var PPTS=BANK.ppts, QS=BANK.qs, QBY={}, PBY={};
QS.forEach(function(q){QBY[q.id]=q;});
PPTS.forEach(function(p){PBY[p.id]=p;});
var LET="ABCDEFGH";
var KEY="sim-angkatan32-v1";
var SHOWALL=true;
var CUSTOM=false;
var $=function(id){return document.getElementById(id);};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

/* ---------- penyimpanan (opsional, aman bila tidak tersedia) ---------- */
var ST={stats:{},flags:{},hist:[],theme:null,last:null};
try{var raw=localStorage.getItem(KEY); if(raw){var o=JSON.parse(raw); for(var k in o) ST[k]=o[k];}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(ST));}catch(e){}}
function setTheme(t){ if(t) document.documentElement.setAttribute("data-theme",t); else document.documentElement.removeAttribute("data-theme"); }
setTheme(ST.theme);
function applyKM(){QS.forEach(function(q){q.a=(ST.km!=="ver"&&q.r!=null)?q.r:q.v;});}
applyKM();
$("themeBtn").onclick=function(){
  var cur=document.documentElement.getAttribute("data-theme");
  var dark=cur? cur==="dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
  ST.theme=dark?"light":"dark"; setTheme(ST.theme); save();
};
$("homeBtn").onclick=function(){ if(S&&S.mode==="exam"&&!S.done){ ask("Keluar dari ujian?","Jawaban sesi ini tidak akan dinilai.",function(){stopTimer();S=null;home();}); } else {stopTimer();S=null;home();} };

function stat(id){return ST.stats[id]||null;}
function record(q,ok){
  var s=ST.stats[q.id]||{n:0,c:0,w:0,last:null};
  s.n++; if(ok) s.c++; else s.w++; s.last=ok?1:0; ST.stats[q.id]=s;
}
function pptStats(pid){
  var qs=QS.filter(function(q){return q.ppt===pid;}),done=0,ok=0,wrong=0;
  qs.forEach(function(q){var s=stat(q.id); if(s){done++; if(s.last===1) ok++; else wrong++;}});
  return {n:qs.length,done:done,ok:ok,wrong:wrong};
}
function topicsOf(pid){
  var m={},order=[];
  QS.forEach(function(q){ if(q.ppt!==pid) return; if(!m[q.topik]){m[q.topik]={n:0,done:0,ok:0};order.push(q.topik);} var t=m[q.topik]; t.n++; var s=stat(q.id); if(s){t.done++; if(s.last===1)t.ok++;} });
  return order.map(function(k){return {name:k,v:m[k]};});
}

/* ---------- modal konfirmasi buatan sendiri (confirm() diblok di frame) ---------- */
var mCb=null;
function ask(title,body,yes,yesLabel){ $("mTitle").textContent=title; $("mBody").innerHTML=body; $("mYes").textContent=yesLabel||"Ya"; mCb=yes; $("modal").classList.add("show"); }
$("mNo").onclick=function(){$("modal").classList.remove("show");mCb=null;};
$("mYes").onclick=function(){$("modal").classList.remove("show"); var f=mCb; mCb=null; if(f) f();};

function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

/* ================= BERANDA ================= */
var examSel={};
PPTS.forEach(function(p){examSel[p.id]=true;});
function home(){
  location.hash="";
  var tot=QS.length, done=0, ok=0, wrongIds=[];
  QS.forEach(function(q){var s=stat(q.id); if(s){done++; if(s.last===1) ok++; else wrongIds.push(q.id);}});
  var flagged=Object.keys(ST.flags).filter(function(k){return ST.flags[k];}).length;
  var h='';
  var rs=ST.sess;
  if(rs&&rs.ids&&rs.ids.length){ var ra=rs.ans.filter(function(a){return a!==null;}).length;
    h+='<div class="resume"><div style="flex:1;min-width:200px"><b>Lanjutkan latihan terakhir</b><div class="small muted">'+esc(rs.title)+' · '+ra+'/'+rs.ids.length+' dijawab · terakhir di soal '+(rs.cur+1)+'</div></div><button class="btn pri" id="hRes">Lanjutkan</button><button class="btn ghost sm" id="hResX">Buang</button></div>'; }
  h+='<div class="hero"><div class="panel"><h1 style="font-size:24px;letter-spacing:-.3px">Bank soal angkatan Blok 3.2</h1>'+
     '<p class="muted" style="margin:6px 0 0">'+tot+' soal UAM & UAS 3.2 dari dua angkatan: Articulatio dan Calcaneus. Pilih angkatan atau set soal, lalu kerjakan dengan kunci angkatan atau kunci terverifikasi. Tiap soal ada kunci, pembahasan semua opsi, dan catatan bila kunci angkatan perlu dikoreksi.</p>'+
     '<div class="stats"><div class="stat"><b>'+done+'</b><span>soal pernah dijawab</span></div><div class="stat"><b>'+(done?Math.round(ok/done*100):0)+'%</b><span>akurasi terakhir</span></div><div class="stat"><b>'+wrongIds.length+'</b><span>masih salah</span></div></div>'+
     '<div class="row" style="margin-top:12px">'+
       (SHOWALL?'<button class="btn pri" id="hAll">Latihan semua soal ('+tot+')</button><button class="btn" id="hAllR">Semua soal diacak</button>':'')+
       '<button class="btn" id="hWrong" '+(wrongIds.length?'':'disabled')+'>Ulangi soal salah ('+wrongIds.length+')</button>'+
       '<button class="btn" id="hFlag" '+(flagged?'':'disabled')+'>Soal ditandai ('+flagged+')</button>'+
       '<button class="btn" id="hNew">Belum dikerjakan ('+(tot-done)+')</button>'+
     '</div>'+
     '<div class="row" style="margin-top:10px">'+['Articulatio','Calcaneus'].map(function(a){var n=QS.filter(function(q){return PBY[q.ppt].bagian==='Angkatan '+a;}).length;return '<button class="btn" data-ang="'+a+'">Semua soal '+a+' ('+n+')</button>';}).join('')+'</div>'+
     '<div style="margin-top:14px"><div class="small muted" style="font-weight:700;margin-bottom:6px">Kunci yang dipakai untuk menilai</div><div class="row">'+
       '<button class="btn sm'+(ST.km!=="ver"?' pri':'')+'" data-km="ref">Kunci angkatan</button><button class="btn sm'+(ST.km==="ver"?' pri':'')+'" data-km="ver">Kunci terverifikasi</button></div>'+
       '<div class="small muted" style="margin-top:6px">'+QS.filter(function(q){return q.r!=null&&q.r!==q.v;}).length+' soal punya kunci angkatan yang berbeda dengan hasil verifikasi. Dua-duanya selalu ditampilkan di pembahasan.</div></div>'+
     (ST.hist.length?'<div style="margin-top:14px"><div class="small muted" style="font-weight:700;margin-bottom:4px">Riwayat simulasi</div>'+ST.hist.slice(-5).reverse().map(function(r){return '<div class="small" style="display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:3px 0"><span>'+esc(r.date)+' · '+r.n+' soal</span><b>'+r.pct+'%</b></div>';}).join('')+'</div>':'')+
     '</div>';
  h+='<div class="panel"><h2>Simulasi ujian blok</h2><p class="muted small" style="margin:0">Soal diambil proporsional dari set soal yang dipilih, diacak, kunci baru muncul setelah ujian dikirim.</p>'+
     '<div class="row"><div class="field" style="flex:1"><label for="exN">Jumlah soal</label><select id="exN"><option>30</option><option selected>50</option><option>100</option><option>150</option><option value="all">Semua</option></select></div>'+
     '<div class="field" style="flex:1"><label for="exT">Waktu per soal</label><select id="exT"><option value="0">Tanpa batas</option><option value="45">45 detik</option><option value="60" selected>60 detik</option><option value="90">90 detik</option></select></div></div>'+
     '<div class="field"><label>Set soal yang diikutkan <button class="btn sm ghost" id="exAll" style="margin-left:6px">Semua</button><button class="btn sm ghost" id="exNone">Kosongkan</button></label><div class="chips" id="exChips"></div></div>'+
     '<button class="btn pri" id="exGo" style="width:100%;justify-content:center;margin-top:6px">Mulai simulasi</button></div></div>';
  if(CUSTOM) h+=customPanel();
  h+='<div class="sect-t"><h2>Latihan per set soal</h2><span class="muted small">Pilih jawaban, langsung dinilai dan dibahas</span></div>';
  var bag=null;
  PPTS.forEach(function(p){
    if(p.bagian!==bag){ if(bag!==null) h+='</div>'; bag=p.bagian; h+='<div class="bagian-h">'+esc(bag)+'</div><div class="grid">'; }
    var s=pptStats(p.id), pct=s.done?Math.round(s.ok/s.done*100):0;
    h+='<div class="card"><h3>'+esc(p.title)+'</h3><div class="meta">'+esc(p.dosen)+' · '+s.n+' soal · dikerjakan '+s.done+(s.done?' · benar '+pct+'%':'')+'</div>'+
       '<div class="bar"><i style="width:'+(s.n?Math.round(s.done/s.n*100):0)+'%"></i></div>'+
       '<div class="row"><button class="btn sm pri" data-pr="'+p.id+'">Latihan</button><button class="btn sm" data-rnd="'+p.id+'">Acak 20</button>'+
       '<button class="btn sm" data-wr="'+p.id+'" '+(s.wrong?'':'disabled')+'>Salah ('+s.wrong+')</button><button class="btn sm ghost" data-tp="'+p.id+'">Subtopik ▾</button></div>'+
       '<div class="topics" id="tp-'+p.id+'">'+topicsOf(p.id).map(function(t){var a=t.v.done?Math.round(t.v.ok/t.v.done*100)+'%':'–';return '<div><span>'+esc(t.name)+'</span><span class="muted">'+t.v.n+' soal · '+a+'</span></div>';}).join('')+'</div></div>';
  });
  h+='</div><p class="muted small" style="margin-top:24px">Tombol keyboard: <kbd>A</kbd>–<kbd>E</kbd> pilih jawaban, <kbd>←</kbd> <kbd>→</kbd> pindah soal, <kbd>F</kbd> tandai ragu. Progres disimpan di browser ini.</p>';
  $("app").innerHTML=h;
  var chips=$("exChips");
  chips.innerHTML=PPTS.map(function(p){return '<span class="chip'+(examSel[p.id]?' on':'')+'" data-ch="'+p.id+'">'+esc(p.title)+'</span>';}).join('');
  chips.onclick=function(e){var c=e.target.closest("[data-ch]"); if(!c) return; var id=c.getAttribute("data-ch"); examSel[id]=!examSel[id]; c.classList.toggle("on",examSel[id]);};
  $("exAll").onclick=function(){PPTS.forEach(function(p){examSel[p.id]=true;}); home();};
  $("exNone").onclick=function(){PPTS.forEach(function(p){examSel[p.id]=false;}); home();};
  $("exGo").onclick=startExam;
  if(SHOWALL){
    $("hAll").onclick=function(){startPractice(QS.slice(),"Latihan semua soal (urut set & nomor)",true);};
    $("hAllR").onclick=function(){startPractice(shuffle(QS.slice()),"Latihan semua soal (acak)",true);};
  }
  if(rs&&$("hRes")){ $("hRes").onclick=resumeSess; $("hResX").onclick=function(){ask("Buang sesi latihan ini?","Progres jawaban per soal tetap tersimpan di statistik; hanya posisi sesi yang dihapus.",function(){delete ST.sess;save();home();},"Buang");}; }
  if(CUSTOM) bindCustom();
  $("hWrong").onclick=function(){startPractice(wrongIds.map(function(i){return QBY[i];}),"Ulangi semua soal salah",true);};
  $("hFlag").onclick=function(){startPractice(QS.filter(function(q){return ST.flags[q.id];}),"Soal ditandai",false);};
  $("hNew").onclick=function(){startPractice(shuffle(QS.filter(function(q){return !stat(q.id);})).slice(0,30),"30 soal belum dikerjakan (acak)",false);};
  $("app").onclick=function(e){
    var b=e.target.closest("button"); if(!b) return;
    var id;
    if((id=b.getAttribute("data-km"))){ ST.km=id; applyKM(); save(); home(); return; }
    if((id=b.getAttribute("data-ang"))){ var a=id; startPractice(QS.filter(function(q){return PBY[q.ppt].bagian==='Angkatan '+a;}),"Semua soal "+a,false); return; }
    if((id=b.getAttribute("data-pr"))) startPractice(QS.filter(function(q){return q.ppt===id;}),PBY[id].title,false);
    else if((id=b.getAttribute("data-rnd"))) startPractice(shuffle(QS.filter(function(q){return q.ppt===id;})).slice(0,20),PBY[id].title+" · acak 20",false);
    else if((id=b.getAttribute("data-wr"))) startPractice(QS.filter(function(q){var s=stat(q.id);return q.ppt===id&&s&&s.last===0;}),PBY[id].title+" · soal salah",true);
    else if((id=b.getAttribute("data-tp"))) $("tp-"+id).classList.toggle("open");
  };
  window.scrollTo(0,0);
}

  });

/* ---------- simpan & lanjutkan sesi latihan ---------- */
function saveSess(){
  if(!S||S.mode!=="practice") return;
  if(S.done){ delete ST.sess; save(); return; }
  ST.sess={title:S.title,ids:S.items.map(function(x){return x.q.id;}),ord:S.items.map(function(x){return x.ord;}),ans:S.items.map(function(x){return x.ans;}),cur:S.cur,t0:S.t0};
  save();
}
function resumeSess(){
  var r=ST.sess; if(!r) return;
  var items=[];
  r.ids.forEach(function(id,i){ var q=QBY[id]; if(!q) return; var ord=r.ord[i]; if(!ord||ord.length!==q.o.length) ord=q.o.map(function(_,k){return k;});
    items.push({q:q,ord:ord,ans:(r.ans[i]==null?null:r.ans[i]),struck:{},fl:!!ST.flags[id]}); });
  if(!items.length){delete ST.sess;save();home();return;}
  S={mode:"practice",title:r.title,items:items,cur:Math.min(r.cur||0,items.length-1),done:false,t0:r.t0||Date.now()};

/* ================= SESI ================= */
var S=null, TIMER=null;
function makeItems(list,shuf){
  return list.map(function(q){ var ord=q.o.map(function(_,i){return i;}); if(shuf) shuffle(ord); return {q:q,ord:ord,ans:null,struck:{},fl:!!ST.flags[q.id]}; });
}
function startPractice(list,title,shuf){
  if(!list.length) return;
  S={mode:"practice",title:title,items:makeItems(list,true),cur:0,done:false,t0:Date.now()};
  quiz(); window.scrollTo(0,0);
}
function startExam(){
  var ids=PPTS.filter(function(p){return examSel[p.id];}).map(function(p){return p.id;});
  if(!ids.length){ask("Belum ada set dipilih","Pilih minimal satu set soal untuk simulasi.",null,"Oke");return;}
  var pool={},total=0;
  ids.forEach(function(id){pool[id]=shuffle(QS.filter(function(q){return q.ppt===id;}));total+=pool[id].length;});
  var nSel=$("exN").value, N=nSel==="all"?total:Math.min(parseInt(nSel,10),total);
  // alokasi proporsional terhadap jumlah soal tiap PPT (metode sisa terbesar), minimal 1 bila N cukup
  var alloc={},rem=[],used=0;
  ids.forEach(function(id){var x=N*pool[id].length/total; alloc[id]=Math.floor(x); rem.push([id,x-alloc[id]]); used+=alloc[id];});
  if(N>=ids.length) ids.forEach(function(id){ if(alloc[id]===0){alloc[id]=1;used++;} });
  rem.sort(function(a,b){return b[1]-a[1];});
  var i=0; while(used<N && i<rem.length*3){var id=rem[i%rem.length][0]; if(alloc[id]<pool[id].length){alloc[id]++;used++;} i++;}
  while(used>N){var mx=ids.reduce(function(a,b){return alloc[a]>=alloc[b]?a:b;}); alloc[mx]--; used--;}
  var list=[]; ids.forEach(function(id){list=list.concat(pool[id].slice(0,alloc[id]));});
  shuffle(list);
  var per=parseInt($("exT").value,10);
  S={mode:"exam",title:"Simulasi Ujian 3.2 (soal angkatan)",items:makeItems(list,true),cur:0,done:false,t0:Date.now(),limit:per?per*list.length:0};
  quiz(); window.scrollTo(0,0);
  if(S.limit) startTimer();
}
function startTimer(){
  stopTimer();
  TIMER=setInterval(function(){
    if(!S||S.done){stopTimer();return;}
    var left=S.limit-Math.floor((Date.now()-S.t0)/1000);
    var el=$("tmr"); if(el){el.textContent=fmt(Math.max(left,0)); el.classList.toggle("low",left<=60);}
    if(left<=0){stopTimer(); finishExam(true);}
  },1000);
}
function stopTimer(){ if(TIMER){clearInterval(TIMER);TIMER=null;} }
function fmt(s){var m=Math.floor(s/60),x=s%60;return (m<10?"0":"")+m+":"+(x<10?"0":"")+x;}

        (exam?'<button class="btn sm pri" id="endB">Kirim & akhiri</button>':'<button class="btn sm" id="endB">Selesai</button>')+'</div>';

  });

  h+='<div class="qnav"><button class="btn" id="prevB" '+(S.cur===0?'disabled':'')+'>← Sebelumnya</button><button class="btn" id="flagB">'+(it.fl?'Hapus tanda':'Tandai ragu')+'</button><div class="sp"></div><button class="btn pri" id="nextB">'+(S.cur===S.items.length-1?(exam&&!S.done?'Kirim & akhiri':'Selesai'):'Berikutnya →')+'</button></div>';
  h+='</div></div><aside class="side" id="side"><div class="panel" style="padding:14px"><div style="font-weight:700;margin-bottom:6px">Peta soal</div>'+
     '<div class="legend">'+(exam&&!S.done?'<span><i></i>Belum</span><span><i style="background:var(--brand-soft);border-color:var(--brand)"></i>Dijawab</span>':'<span><i></i>Belum</span><span><i style="background:var(--good-soft);border-color:var(--good)"></i>Benar</span><span><i style="background:var(--bad-soft);border-color:var(--bad)"></i>Salah</span>')+'<span><i style="background:var(--flag);border-color:var(--flag)"></i>Ragu</span></div>'+
     '<div class="map" id="map">'+S.items.map(function(x,i){
        var c=""; if(x.ans!==null){ if(exam&&!S.done) c="ans"; else c=(x.ans===x.q.a?"ok":"no"); }
        if(i===S.cur) c+=" cur"; if(x.fl) c+=" fl";
        return '<button class="'+c+'" data-go="'+i+'">'+(i+1)+'</button>';}).join('')+'</div>'+
     '<div class="small muted" style="margin-top:8px">'+(exam&&!S.done?'Kunci & pembahasan tampil setelah ujian dikirim.':'')+'</div></div></aside></div>';
  $("app").innerHTML=h;
  saveSess();

function bindQuiz(){
  var it=S.items[S.cur], exam=S.mode==="exam";
  $("app").onclick=function(e){
    var x=e.target.closest("[data-x]");
    if(x){ e.stopPropagation(); var oi=+x.getAttribute("data-x"); it.struck[oi]=!it.struck[oi]; quiz(); return; }
    var o=e.target.closest("[data-o]");
    if(o){ choose(+o.getAttribute("data-o")); return; }
    var g=e.target.closest("[data-go]");
    if(g){ S.cur=+g.getAttribute("data-go"); quiz(); window.scrollTo(0,0); return; }

  };

  $("prevB").onclick=function(){go(-1);};
  $("nextB").onclick=function(){ if(S.cur===S.items.length-1){ endAsk(); } else go(1); };
  $("flagB").onclick=toggleFlag;
  $("endB").onclick=endAsk;

function go(d){ var n=S.cur+d; if(n<0||n>=S.items.length) return; S.cur=n; quiz(); window.scrollTo(0,0); }
function toggleFlag(){ var it=S.items[S.cur]; it.fl=!it.fl; if(it.fl) ST.flags[it.q.id]=1; else delete ST.flags[it.q.id]; save(); quiz(); }
function choose(oi){
  var it=S.items[S.cur];
  if(S.done) return;
  if(S.mode==="practice"){
    if(it.ans!==null) return;
    it.ans=oi; record(it.q,oi===it.q.a); save(); quiz();
  } else { it.ans=(it.ans===oi?null:oi); quiz(); }
}
function endAsk(){
  if(S.done){ results(); return; }
  var n=S.items.length, a=S.items.filter(function(x){return x.ans!==null;}).length, f=S.items.filter(function(x){return x.fl;}).length;

    ask("Kirim jawaban dan akhiri ujian?",'Dijawab <b>'+a+'</b> dari '+n+' soal'+(n-a?' · <b>'+(n-a)+'</b> belum dijawab':'')+(f?' · <b>'+f+'</b> ditandai ragu':'')+'. Setelah dikirim, jawaban tidak bisa diubah.',function(){finishExam(false);},"Ya, kirim");
  } else {

function finishExam(timeout){

/* ---------- pembahasan ---------- */
function explain(it){
  var q=it.q, mine=it.ans, ok=mine===q.a, kpos=it.ord.indexOf(q.a), diff=q.r!=null&&q.r!==q.v, h='<div class="expl">';
  if(mine===null) h+='<div class="verdict na">Tidak dijawab. Kunci: '+LET[kpos]+'. '+q.o[q.a][0]+'</div>';
  else h+='<div class="verdict '+(ok?'ok':'no')+'">'+(ok?'Benar! ':'Belum tepat. ')+'Kunci jawaban: '+LET[kpos]+'. '+q.o[q.a][0]+'</div>';
  if(diff) h+='<div class="note"><b>Kunci angkatan vs kunci terverifikasi:</b> file angkatan menandai <b>'+LET[it.ord.indexOf(q.r)]+'. '+q.o[q.r][0]+'</b>, hasil verifikasi <b>'+LET[it.ord.indexOf(q.v)]+'. '+q.o[q.v][0]+'</b>. Nilai sesi ini memakai '+(ST.km==="ver"?'kunci terverifikasi':'kunci angkatan')+' (bisa diganti di beranda).</div>';
  else if(q.r==null) h+='<div class="note">File angkatan tidak menandai jawaban untuk soal ini, jadi kunci diambil dari hasil verifikasi.</div>';
  if(mine!==null&&!ok){ var mp=it.ord.indexOf(mine);
    if(diff&&mine===q.v) h+='<div class="mistake"><b>Pilihanmu ('+LET[mp]+') sama dengan kunci terverifikasi</b>, tapi berbeda dengan kunci angkatan. Untuk ujian, pahami alasan di catatan di bawah.</div>';
    else h+='<div class="mistake"><b>Kenapa pilihanmu ('+LET[mp]+') keliru:</b> '+q.o[mine][1]+'</div>'; }
  h+='<div class="blk"><h4>Pembahasan</h4><div class="body">'+q.o[q.v][1]+(q.p?'<div style="margin-top:6px">'+q.p+'</div>':'')+'</div></div>';
  h+='<div class="blk"><h4>Pembahasan semua opsi</h4>';
  it.ord.forEach(function(oi,k){
    var good=oi===q.a, me=oi===mine;
    var tags=(good?'<em class="g">Kunci</em>':'')+(diff&&oi===q.r&&!good?'<em class="m">Kunci angkatan</em>':'')+(diff&&oi===q.v&&!good?'<em class="m">Terverifikasi</em>':'')+(me&&!good?'<em class="b">Pilihanmu</em>':'')+(me&&good?'<em class="m">Pilihanmu</em>':'');
    h+='<div class="optx'+(good?' good':'')+(me&&!good?' mine':'')+'"><div class="h">'+LET[k]+'. '+q.o[oi][0]+tags+'</div><p>'+q.o[oi][1]+'</p></div>';
  });
  h+='</div>';
  if(q.n) h+='<div class="note"><b>Catatan:</b> '+q.n+'</div>';
  h+='</div>';
  return h;
}

/* ================= HASIL ================= */
function results(){
  stopTimer(); location.hash="hasil";
  if(S.mode==="practice"&&ST.sess){ delete ST.sess; save(); }
  var items=S.items, exam=S.mode==="exam";
  var ans=items.filter(function(x){return x.ans!==null;}), ok=items.filter(function(x){return x.ans===x.q.a;}), wrong=ans.filter(function(x){return x.ans!==x.q.a;});
  var denom=exam?items.length:Math.max(ans.length,1), pct=Math.round(ok.length/denom*100);
  var per={}, perT={};
  items.forEach(function(x){
    var k=x.q.ppt; per[k]=per[k]||{n:0,ok:0,blank:0}; per[k].n++; if(x.ans===x.q.a) per[k].ok++; if(x.ans===null) per[k].blank++;
    var tk=x.q.ppt+"||"+x.q.topik; perT[tk]=perT[tk]||{n:0,ok:0}; perT[tk].n++; if(x.ans===x.q.a) perT[tk].ok++;
  });
  var col=pct>=80?'var(--good)':pct>=60?'var(--warn)':'var(--bad)';
  var mins=Math.round((Date.now()-S.t0)/60000);
  var h='<div class="panel"><div class="score"><div class="ring" style="background:conic-gradient('+col+' '+pct*3.6+'deg,var(--soft) 0)"><div style="width:84px;height:84px;border-radius:50%;background:var(--paper);display:grid;place-items:center">'+pct+'%</div></div>'+
        '<div><h2 style="font-size:20px">'+(exam?'Hasil simulasi ujian':'Hasil latihan')+'</h2><div class="muted">'+esc(S.title)+(S.timeout?' · waktu habis':'')+'</div>'+
        '<div class="row" style="margin-top:8px"><span class="pill">'+items.length+' soal</span><span class="pill baru">Benar '+ok.length+'</span><span class="pill" style="background:var(--bad-soft);color:var(--bad)">Salah '+wrong.length+'</span><span class="pill">Kosong '+(items.length-ans.length)+'</span><span class="pill">± '+mins+' menit</span></div></div></div>';
  // rekomendasi
  var weakP=Object.keys(per).map(function(k){return {k:k,v:per[k],r:per[k].ok/per[k].n};}).filter(function(x){return x.r<0.7;}).sort(function(a,b){return a.r-b.r;});
  var weakT=Object.keys(perT).map(function(k){return {k:k,v:perT[k],r:perT[k].ok/perT[k].n};}).filter(function(x){return x.r<0.6&&x.v.n>=2;}).sort(function(a,b){return a.r-b.r;}).slice(0,6);
  h+='<div style="margin-top:14px"><b>Rekomendasi belajar ulang:</b> ';
  if(!weakP.length) h+='<span class="muted">Semua PPT di sesi ini ≥ 70%. Lanjutkan dengan simulasi PPT lain atau tambah jumlah soal.</span>';
  else h+=weakP.map(function(x){return esc(PBY[x.k].title)+' ('+Math.round(x.r*100)+'%)';}).join(', ')+(weakT.length?'. Fokus subtopik: '+weakT.map(function(x){var a=x.k.split("||");return esc(a[1])+' <span class="muted">('+esc(PBY[a[0]].title)+')</span>';}).join(', '):'')+'.';
  h+='</div><div class="row" style="margin-top:14px"><button class="btn pri" id="rvAll">Lihat semua pembahasan</button><button class="btn" id="rvWrong" '+(wrong.length||items.length-ans.length?'':'disabled')+'>Ulangi soal salah & kosong</button><button class="btn" id="rvHome">Ke beranda</button></div></div>';
  // per PPT
  h+='<div class="panel" style="margin-top:14px"><h2>Analisis per set soal</h2><div class="tbl-wrap"><table class="rt"><tr><th>Set</th><th class="n">Soal</th><th class="n">Benar</th><th class="n">%</th></tr>'+
     Object.keys(per).sort(function(a,b){return per[a].ok/per[a].n-per[b].ok/per[b].n;}).map(function(k){var v=per[k];return '<tr><td>'+esc(PBY[k].title)+'</td><td class="n">'+v.n+'</td><td class="n">'+v.ok+'</td><td class="n"><b style="color:'+(v.ok/v.n>=0.8?'var(--good)':v.ok/v.n>=0.6?'var(--warn)':'var(--bad)')+'">'+Math.round(v.ok/v.n*100)+'%</b></td></tr>';}).join('')+'</table></div></div>';
  h+='<div class="panel" style="margin-top:14px"><h2>Analisis per topik</h2><div class="tbl-wrap"><table class="rt"><tr><th>Topik</th><th>Set</th><th class="n">Benar</th><th class="n">%</th></tr>'+
     Object.keys(perT).sort(function(a,b){return perT[a].ok/perT[a].n-perT[b].ok/perT[b].n;}).map(function(k){var v=perT[k],a=k.split("||");return '<tr><td>'+esc(a[1])+'</td><td class="muted small">'+esc(PBY[a[0]].title)+'</td><td class="n">'+v.ok+'/'+v.n+'</td><td class="n">'+Math.round(v.ok/v.n*100)+'%</td></tr>';}).join('')+'</table></div></div>';
  // daftar salah
  var bad=items.map(function(x,i){return {x:x,i:i};}).filter(function(o){return o.x.ans!==o.x.q.a;});
  h+='<div class="panel" style="margin-top:14px"><h2>Daftar soal salah & kosong ('+bad.length+')</h2><p class="muted small" style="margin:0 0 10px">Ketuk soal untuk membuka pembahasan lengkap.</p>';
  bad.forEach(function(o){
    var stemTxt=o.x.q.s.replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim();
    h+='<div class="wrong-item"><button class="wi-head"><b>'+(o.i+1)+'.</b><span style="flex:1">'+esc(stemTxt.length>170?stemTxt.slice(0,170)+'…':stemTxt)+'<br><span class="muted small">'+esc(PBY[o.x.q.ppt].title)+' · '+esc(o.x.q.topik)+'</span></span></button><div class="wi-body"><div class="stem">'+o.x.q.s+'</div>'+explain(o.x)+'</div></div>';
  });
  if(!bad.length) h+='<div class="muted">Tidak ada. Mantap!</div>';
  h+='</div>';
  $("app").innerHTML=h;
  $("app").onclick=function(e){var wi=e.target.closest(".wi-head"); if(wi) wi.parentNode.classList.toggle("open");};
  document.querySelectorAll(".qimg").forEach(function(i){i.onclick=function(){i.classList.toggle("zoom");};});
  $("rvAll").onclick=function(){S.cur=0; quiz(); window.scrollTo(0,0);};
  $("rvWrong").onclick=function(){ startPractice(bad.map(function(o){return o.x.q;}),"Ulangi soal salah & kosong",true); };
  $("rvHome").onclick=function(){S=null;home();};
  window.scrollTo(0,0);
}

/* ---------- keyboard ---------- */
document.addEventListener("keydown",function(e){
  if($("modal").classList.contains("show")){ if(e.key==="Escape") $("mNo").click(); if(e.key==="Enter") $("mYes").click(); return; }
  if(!S||location.hash!=="#soal") return;
  if(e.target.tagName==="SELECT"||e.target.tagName==="INPUT") return;
  var k=e.key.toUpperCase(), it=S.items[S.cur];
  var idx=LET.indexOf(k);
  if(idx>=0&&idx<it.ord.length&&k.length===1){ choose(it.ord[idx]); e.preventDefault(); }
  else if(e.key==="ArrowRight") go(1);
  else if(e.key==="ArrowLeft") go(-1);
  else if(k==="F") toggleFlag();
});
window.addEventListener("hashchange",function(){ if(!location.hash && S && !S.done && S.mode==="exam"){ location.hash="soal"; } });
home();
})();
</script>
</body>
</html>
