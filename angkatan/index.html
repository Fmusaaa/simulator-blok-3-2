<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bank Soal Angkatan 3.2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6f8;--paper:#ffffff;--ink:#16202a;--muted:#5d6b78;--line:#dfe4ea;--soft:#eef2f6;
  --brand:#0f6e6a;--brand-soft:#e2f2f0;--accent:#c2410c;--accent-soft:#fdeee5;
  --good:#15803d;--good-soft:#e5f5ea;--bad:#b91c1c;--bad-soft:#fdeaea;--warn:#a16207;--warn-soft:#fdf6dc;
  --flag:#7c3aed;--flag-soft:#f1eafe;--hema:#0f6e6a;--hema-soft:#e2f2f0;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.06);
  --sans:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1418;--paper:#171e24;--ink:#e6edf3;--muted:#98a6b3;--line:#2a343d;--soft:#1e272e;
  --brand:#4fd1c5;--brand-soft:#123432;--accent:#fb923c;--accent-soft:#3a2416;
  --good:#4ade80;--good-soft:#14301f;--bad:#f87171;--bad-soft:#3a1a1a;--warn:#facc15;--warn-soft:#352c0f;
  --flag:#c4b5fd;--flag-soft:#2a2142;--hema:#4fd1c5;--hema-soft:#123432;--shadow:none}}
:root[data-theme="dark"]{
  --bg:#0f1418;--paper:#171e24;--ink:#e6edf3;--muted:#98a6b3;--line:#2a343d;--soft:#1e272e;
  --brand:#4fd1c5;--brand-soft:#123432;--accent:#fb923c;--accent-soft:#3a2416;
  --good:#4ade80;--good-soft:#14301f;--bad:#f87171;--bad-soft:#3a1a1a;--warn:#facc15;--warn-soft:#352c0f;
  --flag:#c4b5fd;--flag-soft:#2a2142;--hema:#4fd1c5;--hema-soft:#123432;--shadow:none}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1080px;margin:0 auto;padding:16px}
header.top{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-top:10px;padding-bottom:10px}
.logo{font-weight:800;font-size:17px;letter-spacing:-.2px}
.logo span{color:var(--brand)}
.sp{flex:1}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;min-height:40px}
.btn:hover{border-color:var(--brand)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
:root[data-theme="dark"] .btn.pri{color:#06201e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.pri{color:#06201e}}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;min-height:32px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.icon-btn{border:1px solid var(--line);background:var(--paper);border-radius:10px;width:40px;height:40px;display:grid;place-items:center}
h1,h2,h3{line-height:1.25;margin:0}
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin:8px 0 20px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.panel h2{font-size:18px;margin-bottom:6px}
.muted{color:var(--muted)}
.small{font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.stat{background:var(--soft);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:4px;margin:10px 0}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
select,input[type=number]{font:inherit;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:40px}
.chips{display:flex;flex-wrap:wrap;gap:6px;max-height:190px;overflow:auto;padding:2px}
.chip{border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12.5px;background:var(--paper);user-select:none}
.chip.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand);font-weight:600}
.lp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:720px){.lp-grid{grid-template-columns:1fr 1fr}}
.bag-btns{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 6px}
.resume{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--brand-soft);border:1px solid var(--brand);border-radius:14px;padding:12px 14px;margin:0 0 16px}
.sect-t{display:flex;align-items:baseline;gap:10px;margin:22px 0 10px}
.sect-t h2{font-size:17px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.card h3{font-size:15.5px}
.card .meta{font-size:12.5px;color:var(--muted)}
.bar{height:6px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand)}
.topics{display:none;border-top:1px dashed var(--line);padding-top:8px}
.topics.open{display:block}
.topics div{display:flex;justify-content:space-between;font-size:13px;padding:2px 0;gap:10px}
.bagian-h{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--accent);margin:18px 0 8px}
/* quiz */
.qbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 12px}
.pill{font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--soft);color:var(--muted)}
.pill.brand{background:var(--brand-soft);color:var(--brand)}
.pill.asli{background:var(--accent-soft);color:var(--accent)}
.pill.pred{background:var(--flag-soft);color:var(--flag)}
.pill.baru{background:var(--good-soft);color:var(--good)}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.timer.low{color:var(--bad)}
.layout{display:grid;grid-template-columns:1fr 260px;gap:16px;align-items:start}
.qcard{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow)}
.qnum{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:8px}
.stem{font-size:16.5px;margin-bottom:16px}
.stem p{margin:0 0 8px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--paper);text-align:left;width:100%;position:relative}
.opt:hover{border-color:var(--brand)}
.opt .L{flex:0 0 28px;height:28px;border-radius:8px;display:grid;place-items:center;font-weight:700;background:var(--soft);font-size:14px}
.opt .T{flex:1;padding-top:2px}
.opt.sel{border-color:var(--brand);background:var(--brand-soft)}
.opt.sel .L{background:var(--brand);color:#fff}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.ok .L{background:var(--good);color:#fff}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt.no .L{background:var(--bad);color:#fff}
.opt.struck .T{text-decoration:line-through;opacity:.5}
.opt .x{flex:0 0 auto;border:none;background:transparent;color:var(--muted);font-size:14px;padding:2px 6px;border-radius:6px}
.opt .x:hover{background:var(--soft)}
.opt.locked{cursor:default}
.qnav{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.qnav .sp{flex:1}
.side{position:sticky;top:76px}
.map{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;max-height:52vh;overflow:auto;padding:2px}
.map button{border:1px solid var(--line);background:var(--paper);border-radius:8px;height:34px;font-size:12.5px;font-weight:600;position:relative}
.map button.ans{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
.map button.ok{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.map button.no{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.map button.cur{outline:2px solid var(--ink);outline-offset:1px}
.map button.fl::after{content:"";position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--flag)}
.legend{display:flex;flex-wrap:wrap;gap:8px;font-size:12px;color:var(--muted);margin:8px 0}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;border:1px solid var(--line);vertical-align:-1px;margin-right:4px}
/* pembahasan */
.expl{margin-top:16px;border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:12px}
.verdict{font-weight:800;font-size:15px;padding:10px 12px;border-radius:12px}
.verdict.ok{background:var(--good-soft);color:var(--good)}
.verdict.no{background:var(--bad-soft);color:var(--bad)}
.verdict.na{background:var(--soft);color:var(--muted)}
.blk h4{margin:0 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.blk .body{font-size:15px}
.optx{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px;font-size:14.5px}
.optx.good{border-color:var(--good);background:var(--good-soft)}
.optx.mine{border-color:var(--bad)}
.optx .h{font-weight:700;margin-bottom:4px}
.optx .h em{font-style:normal;font-size:12px;font-weight:700;padding:1px 7px;border-radius:99px;margin-left:6px}
.optx .h em.g{background:var(--good);color:#fff}
.optx .h em.b{background:var(--bad);color:#fff}
.optx .h em.m{background:var(--soft);color:var(--muted)}
.optx p{margin:2px 0}
.optx p b{color:var(--muted);font-weight:600}
.note{background:var(--warn-soft);border-left:4px solid var(--warn);border-radius:10px;padding:10px 12px;font-size:14.5px}
.tip{background:var(--brand-soft);border-left:4px solid var(--brand);border-radius:10px;padding:10px 12px;font-size:14.5px}
.key{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:14.5px}
.mistake{background:var(--bad-soft);border-left:4px solid var(--bad);border-radius:10px;padding:10px 12px;font-size:14.5px}
/* tabel & gambar dari bank lama */
.lab{margin:12px 0;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--soft);max-width:100%;overflow-x:auto}
.lab-t{font-weight:700;font-size:14px;color:var(--hema)}
.lab-i{font-size:13px;color:var(--muted);margin:2px 0 6px}
.lab-n{font-size:13px;color:var(--warn);margin-top:6px}
.t22{border-collapse:collapse;font-size:15px;min-width:100%}
.t22 th,.t22 td{border-bottom:1px solid var(--line);padding:6px 10px;text-align:left}
.t22 th{font-size:13px;color:var(--muted)}
.t22 .fl{color:var(--bad)}
.tagnew{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--hema-soft);color:var(--hema);vertical-align:2px}
.qimg{display:block;max-width:100%;max-height:360px;width:auto;height:auto;margin:12px 0;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:zoom-in}
.qimg.zoom{max-height:none;width:100%;cursor:zoom-out}
/* hasil */
.score{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.ring{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:26px}
table.rt{width:100%;border-collapse:collapse;font-size:14px}
table.rt th,table.rt td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.rt th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
table.rt td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl-wrap{overflow-x:auto}
.wrong-item{border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--paper)}
.wrong-item>button{width:100%;text-align:left;border:none;background:transparent;padding:12px;display:flex;gap:10px}
.wrong-item .wi-body{padding:0 12px 12px;display:none}
.wrong-item.open .wi-body{display:block}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal-bg.show{display:flex}
.modal{background:var(--paper);border-radius:16px;padding:20px;max-width:420px;width:100%;border:1px solid var(--line)}
.modal h3{margin-bottom:8px}
.hide{display:none!important}
.mob-map{display:none}
@media (max-width:860px){
  .hero{grid-template-columns:1fr}
  .layout{grid-template-columns:1fr}
  .side{display:none;position:static}
  .side.show{display:block}
  .mob-map{display:inline-flex}
  .qcard{padding:16px}
  .map{grid-template-columns:repeat(8,1fr)}
}
@media (max-width:420px){.stats{grid-template-columns:repeat(3,1fr)}.stat b{font-size:18px}.map{grid-template-columns:repeat(6,1fr)}}
kbd{font-family:inherit;font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--soft)}
</style>
<script data-goatcounter="https://fmusaaa.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>

,"no":"7","ord":7},{"id":8,"ppt":"art-uam","topik":"Asam basa & elektrolit","s":"Manakah dibawah ini yang merupakan penyebab dari asidosis respiratorik yang berasal dari depresi pusat pernafasan ?","o":[["Penyakit PPOK","PPOK: obstruksi jalan napas, bukan depresi pusat napas.",""],["Miastenia gravis","Miastenia gravis: kelemahan neuromuskular.",""],["Deformitas dada","Deformitas dada: gangguan dinding dada.",""],["Cedera cerebrovaskuler","Benar: cedera serebrovaskular menekan pusat napas di batang otak sehingga hipoventilasi.",""],["Overdosis obat pelumpuh otot","Obat pelumpuh otot bekerja di sambungan neuromuskular, bukan di pusat napas.",""]],"a":3,"v":3,"r":3,"p":"Asidosis respiratorik = hipoventilasi. Penyebab sentral: stroke batang otak, cedera kepala, opioid/sedatif.","k":"","t":"","n":"","tag":"asli","lbl":"SOAL ASLI · UAM Articulatio","no":"8","ord":8},{"id":9,"ppt":"art-uam","topik":"Onkologi & petanda tumor","s":"Neoplasma (jinak atau ganas) mempunyai komponen dasar, Manakah komponen dasar neoplasma yang salah ?","o":[["Parenkim merupakan sel neoplastik yang proliferatif, yang menentukan perilaku biologis tumor determine their behavior and pathologic consequences","Pernyataan benar: parenkim = sel neoplastik proliferatif.",""],["Stroma merupakan jaringan pendukung parenkim, tidak bersifat neoplastik, terdiri dari jaringan ikat dan pembuluh darah the growth and evolution of neoplasma.","Pernyataan benar: stroma pendukung, non-neoplastik.",""],["Parenkim merupakan sel neoplastik yang TIDAK proliferatif, yang menentukan perilaku biologis tumor determine their behavior and pathologic consequences","Benar sebagai jawaban: parenkim justru PROLIFERATIF.",""],["Pembuluh darah meruoakan bagian dari stoma","Pernyataan benar.",""],["Jaringan ikat merupakan bagian dari stroma.","Pernyataan benar.",""]],"a":2,"v":2,"r":2,"p":"Neoplasma = parenkim (sel tumor, menentukan perilaku) + stroma (jaringan ikat dan pembuluh darah, menentukan pertumbuhan).","k":"","t":"","n":"", ppt":"art-uam","topik":"Gizi klinik","s":"Seorang pasien dilakukan MST ( Malnutrition Screning Tools) dengan jawaban terjadi penurunan berat badan 6 bulan terakhir sekitar 14 kg dan tidak nafsu makan, berapa nilai MST nya ?","o":[["1","Terlalu kecil.",""],["2","Terlalu kecil.",""],["3","Hanya skor penurunan BB.",""],["4","Benar: turun 11–15 kg = skor 3, ditambah nafsu makan berkurang = skor 1, total 4.",""],["5","Terlalu besar.",""]],"a":3,"v":3,"r":3,"p":"MST: penurunan BB 1–5 kg = 1; 6–10 = 2; 11–15 = 3; &gt;15 = 4; tidak yakin = 2. Nafsu makan turun = 1. Skor ≥ 2 → berisiko malnutrisi.","k":"","t":"","n":"","tag":"asli","lbl":"SOAL ASLI · UAM Articulatio","no":"24","ord":24},{"id":25,"ppt":"art-uam","topik":"Asam basa & elektrolit","s":"Manakah dibawah ini yang merupakan sistem buffer di dalam tubuh ?","o":[["Buffer calsium","Bukan sistem buffer utama.",""],["Buffer bikarbonat","Benar: buffer bikarbonat adalah sistem buffer ekstrasel utama.",""],["Buffer natrium","Bukan buffer.",""],["Buffer kalium","Bukan buffer.",""],["Buffer magnesium","Bukan buffer.",""]],"a":1,"v":1,"r":1,"p":"Buffer tubuh: bikarbonat, fosfat, protein (termasuk hemoglobin).","k":"","t":"","n":"","tag":"asli","lbl":"SOAL ASLI · UAM Articulatio","no":"25","ord":25},{"id":26,"ppt":"art-uam","topik":"Diabetes melitus","s":"Seorang laki-laki usia 60 tahun menderita DM tipe 2 selama 2 tahun. Mendapatkan terapi diet rendah karbohidrat sederhana dan Metformin 3 x 500 mg. Namun akhir- akhir ini kadar HbA1C saat kontrol adalah 8 persen. Dokter kemudian menambahkan terapi berupa obat golongan Sulfonilurea generasi kedua. Manakah yang tidak termasuk obat golongan tersebut?","o":[["Glibenclamide","Sulfonilurea generasi kedua.",""],["Tolbutamide","Benar sebagai jawaban: tolbutamid adalah generasi pertama.",""],["Glipizide","Generasi kedua.",""],["Gliclazide","Generasi kedua.",""],["Glimepiride","Generasi kedua (kadang disebut ketiga).",""]],"a":1,"v":1,"r":1,"p":"Generasi I: tolbutamid, klorpropamid. Generasi II: glibenklamid, glipizid, gliklazid, glimepirid.","k":"","t":"","n":"","tag":"asli","lbl":"SOAL ASLI · UAM Articulatio","no":"26","ord":26},{"id":27,"ppt":"art-uam","topik":"Gizi klinik","s":"Berapa kebutuhan energi berdasarkan AMD seorang pasien 50 tahun, BB 60, TB 160?","o":[["1.654 kkal","Angka pengecoh, beda tipis dengan B.",""],["1.645 kkal","Jawaban yang ditandai referensi angkatan.",""],["1.564 kkal","Angka pengecoh (digit dibalik).",""],["1.546 kkal","Angka pengecoh (digit dibalik).",""],["1.456 kkal","Angka pengecoh.",""]],"a":1,"v":1,"r":1,"p":"Harris-Benedict laki-laki: 66 + 13,7·BB + 5·TB − 6,8·U. Coretan di file referensi: 66 + 822 + 800 − 340 = 1.348 (BEE), lalu dicatat ± 1.648 setelah faktor tambahan.","k":"","t":"","n":"Soal tidak menyebut jenis kelamin dan faktor aktivitas, sehingga hasilnya tidak bisa dipastikan. Kunci mengikuti referensi angkatan (B). Pastikan rumus yang dipakai dosen di slide gizi.","tag":"asli","lbl":"SOAL ASLI · UAM Articulatio","no":"27","ord":27},{"id":28,"ppt":"art-uam","topik":"Diabetes melitus","s":"Laki-laki, usia 54 tahun datang dengan gejala banyak kencing, sering haus dan sering kelapara.. Hasil GDS 245 mg per dL. Secara fisiologis, apa kompensasi yang terjadi pada hepar untuk mencegah hiperglikemia?","o":[["Lipolisis","Lipolisis meningkatkan asam lemak bebas, bukan mencegah hiperglikemia.",""],["Lipogenesis","Lipogenesis terjadi saat glukosa berlebih, tetapi bukan jawaban referensi.",""],["Glukoneogenesis","Jawaban referensi: hepar meningkatkan glukoneogenesis pada DM (lihat catatan).",""],["Glikolisis","Glikolisis memakai glukosa; secara fisiologi justru menurunkan glukosa.",""],["Dekarboksilasi oksidatif","Proses mitokondria, tidak spesifik.",""]],"a":2,"v":2,"r":2,"p":"Pada DM tipe 2, resistensi insulin hepar menyebabkan glukoneogenesis tidak tertekan sehingga glukosa naik.","k":"","t":"","n":"Kalimat soal ambigu. Secara harfiah, mekanisme hepar untuk MENCEGAH hiperglikemia adalah glikolisis/glikogenesis. Kunci referensi C (glukoneogenesis) cocok bila maksud soal 'apa yang terjadi di hepar pada DM'. Ikuti kunci referensi untuk ujian angkatan ini.","tag":"asli","lbl":"SOAL ASLI · UAM Articulatio","no":"28","ord":28},{"id":29,"ppt":"art-uam","topik":"Tiroid","s":"Macam – macam autoimun disease adalah autoimun organ dan autoimun sistemik. Manakah dibawah ini yang termasuk autoimun sistemik ?","o":[["Autoimune hemolytic anemia","<b>Keterangan:<\/b> AHA. AHA: organ spesifik (sel darah merah).",""],["Tyroiditis Hashimoto.","Hashimoto: organ spesifik.",""],["Penyakit Grave","Graves: organ spesifik.",""],["SLE","Benar: SLE adalah autoimun sistemik klasik.",""],["Polimiositis atau dermatomiositis","Polimiositis juga sering digolongkan sistemik, tetapi SLE jawaban paling tepat.",""]],"a":3,"v":3,"r":3,"p":"Autoimun sistemik: SLE, RA, skleroderma, Sjögren.","k":"","t":"","n":"","tag":"asli","lbl":"SOAL ASLI · UAM Articulatio","no":"29","ord":29},{"id":30,"ppt":"art-uam","topik":"Gizi klinik","s":"Seorang pria berusia 55 tahun datang dengan keluhan tegang pada kepala bagian belakang dan leher. Pasien juga merasa kakinya terkadang pegal pegal. Pasien sangat menyukai makan yang bersantan. Pemeriksaan fisik tanda-tanda vital dalam batas normal. BB 85 kg TB 175 cm. Apakah diet yang dianjurkan untuk pasien tersebut?","o":[["Diet rendah protein","Tidak ada indikasi gangguan ginjal.",""],["Rendah karbohidrat","Bukan masalah utama.",""],["Rendah lemak","Benar: suka makanan bersantan dan overweight (IMT 27,8) → diet rendah lemak (jenuh).",""],["Tinggi protein","Tidak tepat.",""],["Tinggi serat","Serat dianjurkan, tetapi masalah utama asupan lemak jenuh.",""]],"a":2,"v":2,"r":2,"p":"Santan tinggi lemak jenuh yang menaikkan LDL.","k":"","t":"","n":"","tag":"asli","lbl":"SOAL ASLI · UAM Articulatio","no":"30","ord":30},{"id":31,"ppt":"art-uam","topik":"K3 & kesehatan lingkungan","s":"Kabupaten A sedang melaksanakan program pengentasan ODF di wilayahnya. Semua puskesmas dikerahkan untuk memonitor penggunaan jamban sehat. Pada Puskesmas X didapatkan banyak warga Desa B yang masih BAB di sungai. Jamban yang tersedia berupa bilik yang langsung membuang kotoran ke sungai. Apakah tipe jamban di desa tersebut?","o":[["Pit Privy","Pit privy: lubang di tanah (cubluk).",""],["Bucket Latrine","Bucket latrine: tampungan ember.",""],["Trench Latrine","Jawaban referensi: trench latrine (parit).",""],["Water Sealed Latrine","Water sealed: leher angsa, paling sehat.",""],["Chemical Latrine","Chemical: memakai bahan kimia.",""]],"a":2,"v":2,"r":2,"p":"Jamban sehat = leher angsa dengan septic tank.","k":"","t":"","n":"Jamban yang langsung membuang ke sungai secara teknis disebut overhung latrine (jamban cemplung di atas air), yang tidak ada di opsi. Kunci mengikuti referensi (C).","tag":"asli","lbl":"SOAL ASLI · UAM Articulatio","no":"31","ord":31},{"id":32,"ppt":"art-uam","topik":"Onkologi & petanda tumor","s":"Apa gambaran metastase paru dengan multiple nodul ukuran lebih dari 4 cm ?","o":[["Coin lesion","Coin lesion: nodul soliter &lt; 3 cm.",""],["Cannonball","Benar: cannonball = metastasis nodul multipel besar berbatas tegas.",""],["Reticular pattern","Pola garis interstisial.",""],["Miliary pattern","Milier: nodul 1–3 mm difus.",""],["Macronodul","Bukan istilah baku.",""]],"a":1,"v":1,"r":1,"p":"Cannonball klasik pada metastasis Ca ginjal, koriokarsinoma, sarkoma.","k":"","t":"","n":"","tag":"asli","lbl":"SOAL ASLI · UAM Articulatio","no":"32","ord":32},{"id":33,"ppt":"art-uam","topik":"Diabetes melitus","s":"Seorang laki-laki berusia 51 tahun datang dengan ke poliklinik penykit dalam dengan keluhan nyeri leher sejak 3 hari yang lalu. Pasien juga mengeluhka sering lapar dan haus sejak 1 bulan yang lalu .TD 150 per 92,nadi 88x per menit , RR 20x per menit,suhu afebris. Hasil pemeriksaan laboratorium didapatkan GDS 359 mg per dL, GDP 160 mg per dL, Kolestrol total 189 mg per dl, LDL 180 mg per dL ,TGS 178 mg per dl. Apakah diagnosis tepat pada pasien tersebut ?","o":[["Hipertensi","Hanya salah satu komponen.",""],["Sindrom metabolik","Benar menurut referensi: TD ≥ 130/85, GDP ≥ 100, TG ≥ 150 (3 kriteria ATP III) → sindrom metabolik.",""],["DM tipe II","Pasien juga memenuhi kriteria DM (GDS ≥ 200 + gejala; GDP ≥ 126).",""],["Dislipidemi","Hanya satu komponen.",""],["DM tipe I","Tidak sesuai (usia, gejala).",""]],"a":1,"v":1,"r":1,"p":"Sindrom metabolik mencakup hipertensi, hiperglikemia, dan dislipidemia sekaligus.","k":"","t":"","n":"Pasien juga memenuhi kriteria DM tipe 2 (GDS 359 + gejala, GDP 160). Kunci referensi B karena satu diagnosis yang mencakup semua temuan.","tag":"asli","lbl":"SOAL ASLI · UAM Articulatio","no":"33","ord":33},{"id":34,"ppt":"art-uam","topik":"Tiroid","s":"Seorang pria usia 45 tahun datang ke dokter dengan keluhan berdebar-debar dan gelisah sejak 1 bulan terakhir. Dari pemeriksaan fisik didapatkan TD 120 per 80, HR 140x menit, RR 30x menit, Tax 38,9 C dan didapatkan nodul diffuse pada leher ukuran 5 cm. Pasien diberikan obat untuk mengurangi keluhan berdebar. Apa efek samping yang terjadi apabila pemberian obat tersebut terlalu tinggi dosisnya ?","o":[["Takikardi","Takikardia justru ditekan oleh β-bloker.",""],["Hipertensi","β-bloker menurunkan TD.",""],["Hipotensi","Benar: propranolol dosis berlebih menyebabkan hipotensi dan bradikardia.",""],["Delirium","Bukan efek khas.",""],["Pandangan kabur","Bukan efek khas.",""]],"a":2,"v":2,"r":2,"p":"Propranolol = terapi simptomatik tirotoksikosis.","k":"","t":"","n":"","tag":"asli","lbl":"SOAL ASLI · UAM Articulatio","no":"34","ord":34},{"id":35,"ppt":"art-uam","topik":"Gizi klinik","s":"Seorang laki-laki berusia 45 tahun datang ke klinik dengan keluhan riwayat asam urat. Ada riwayat nyeri sebelumnya ,diberikan obat antinyeri lalu keluhan menghilang. Riwayat keluhan nyeri berulang. Pada pemeriksaan tanda-tanda vital dalam batas normal. Pada MTP 1 dextra di temukan tofus, hiperemis (-). Hasil laboratorium asam urat 9 mg per dL. Apakah terapi yang tepat untuk menurunkan asam urat ?","o":[["Allupurinol","Benar: allopurinol (xanthine oxidase inhibitor) menurunkan produksi asam urat.",""],["Kolkisin","Kolkisin untuk serangan akut/profilaksis, tidak menurunkan asam urat.",""],["Paracetamol","Analgesik.",""],["Kodein","Analgesik opioid.",""],["Meloxicam","OAINS untuk nyeri akut.",""]],"a":0,"v":0,"r":0,"p":"Terapi penurun urat dimulai setelah serangan akut reda; target &lt; 6 mg/dL (&lt; 5 bila tofus).","k":"","t":"","n":"","tag":"asli","lbl":"SOAL ASLI · UAM Articulatio","no":"35","ord":35},{"id":36,"ppt":"art-uam","topik":"K3 & kesehatan lingkungan","s":"Menurut H.L. Blum pada tahun 1978 menyatakan bahwa faktor penentu kesehatan mencakup faktor genetic, perilaku, lingkungan dan pelayanan kesehatan. Kondisi kesehatan di Indinesia di pengaruhi oleh faktor lingkungan. Masalah kesehatan lingkungan di negara berkembang seperti di Indonesia pada umumnya mencakup apa ?","o":[["Masalah sanitasi jamban","Benar: sanitasi (jamban, air bersih) masalah kesehatan lingkungan utama negara berkembang.",""],["Penyediaan kartu Indonesia sehat","Masalah pembiayaan.",""],["Penderia TBC meludah di sembarang tempat","Masalah perilaku.",""],["Penggunaan kondom untuk mencegah PMS","Masalah perilaku.",""],["Perilaku pemulihan kesehatan.","Masalah perilaku.",""]],"a":0,"v":0,"r":0,"p":"Blum: lingkungan, perilaku, pelayanan kesehatan, genetik.","k":"","t":"","n":"","tag":"asli","lbl":"SOAL ASLI · UAM Articulatio","no":"36","ord":36},{"id":37,"ppt":"art-uam","topik":"Onkologi & petanda tumor","s":"Manakah bukan hal yang benar di dalam melakukan interpretasi petanda tumor ?","o":[["Tidak ada satupun petanda tumor ekstrasel yang spesifik","Benar: tidak ada petanda tumor serum yang spesifik mutlak.",""],["Panel petanda tumor untuk meningkatkan spesifisitas","Benar: panel meningkatkan spesifisitas.",""],["Cluster of differentiation untuk mengetahui keganasan lineage tertentu","Benar: CD untuk lineage leukemia/limfoma.",""],["Hiperploidi atau hipoploidi mer atio","no":"52","ord":52},{"id":53,"ppt":"art-uam","topik":"Tiroid","s":"Kelenjar yang terletak di atas setiap ginjal, tersusun atas dua bagian yaitu bagian koteks (luar) dan bagian dalam (medulla) disebut kelenjar apa ?","o":[["Tiroid","Di leher.",""],["Paratiroid","Di belakang tiroid.",""],["Adrenal","Benar: adrenal di atas ginjal, korteks dan medula.",""],["Pancreas","Di retroperitoneum dekat duodenum.",""],["Hipofisis","Di sella tursika.",""]],"a":2,"v":2,"r":2,"p":"Korteks: glomerulosa, fasikulata, retikularis; medula: katekolamin.","k":"","t":"","n":"","tag":"asli","lbl":"SOAL ASLI · UAM Articulatio","no":"53","ord":53},{"id":54,"ppt":"art-uam","topik":"Hemostasis & hemodinamika","s":"Seorang anak laki-laki usia 3 tahun datang dengan keluhan lebam pada lutut yang terjadi secara tiba-tiba. Riwayat keluarga tidak ada yang sakit seperti ini sebelumnya. Dokter tersebut mencurigai bahwa anak tersebut menderita hemofilia. Jika Anda bekerja pada daerah terpencil, pemeriksaan apakah yang Anda usulkan untuk menegakkan diagnosis ?","o":[["Rumple leed","Rumple-Leede: kerapuhan kapiler.",""],["Bleeding time","Bleeding time: fungsi trombosit/vaskular, normal pada hemofilia.",""],["Hitung trombosit","Jumlah trombosit normal pada hemofilia.",""],["Clotting time","Benar: clotting time memanjang pada defek faktor (hemofilia), mudah di fasilitas terbatas.",""],["Fonio test","Bukan tes baku.",""]],"a":3,"v":3,"r":3,"p":"Hemofilia: aPTT memanjang, PT dan BT normal.","k":"","t":"","n":"","tag":"asli","lbl":"SOAL ASLI · UAM Articulatio","no":"54","ord":54},{"id":55,"ppt":"art-uam","topik":"Radiologi","s":"Apa deskripsi x foto massa padat pada mediastinum superior ?","o":[["Tampak opasitas batas tegas pada perihiler kanan kiri.","Benar menurut referensi: foto polos memakai istilah opasitas (radiopak) berbatas tegas.",""],["Tampak lusensi batas tegas pada perihiler dan paratrakea kanan kiri.","Lusensi = hitam (udara), tidak sesuai massa padat.",""],["Tampak densitas batas tegas pada tikan obat DM","Istirahat saja tidak mengatasi hipoglikemia.",""]],"a":1,"v":1,"r":1,"p":"Aturan 15-15: 15 g glukosa, cek ulang 15 menit.","k":"","t":"","n":"","tag":"asli","lbl":"SOAL ASLI · UAM Articulatio","no":"57","ord":57},{"id":58,"ppt":"art-uam","topik":"Onkologi & petanda tumor","s":"Manakah pernyataan yang salah pada Kecepatan pertumbuhan (rate of growth) pada tumor Secara umum ?","o":[["Kebanyakan tumor jinak tumbuh lambat.","Benar.",""],["Tergantung hormon dan supply darah","Benar.",""],["Leiomyoma uterus akan tumbuh cepat jika estrogen BERKURANG","<b>Keterangan:<\/b> kehamilan. Benar sebagai jawaban: leiomioma membesar saat estrogen MENINGKAT (kehamilan).",""],["Kebanyakan tumor ganas: tumbuh cepat.","Benar.",""],["Secara umum, kecepatan pertumbuhan tumor berhubungan dengan derajat differensiasinya tumor ganas tumbuh lebih cepat dari pada tumor jinak.","Benar.",""]],"a":2,"v":2,"r":2,"p":"Leiomioma uterus bergantung estrogen; mengecil setelah menopause.","k":"","t":"","n":"","tag":"asli","lbl":"SOAL ASLI · UAM Articulatio","no":"58","ord":58},{"id":59,"ppt":"art-uam","topik":"Diabetes melitus","s":"Seorang pria usia 65 tahun dengan keluhan kencing terus. Hasil pemeriksaan Glukosa darah sewaktu 225 mg per dl, reduksi urin positif 1, protein urin positif 2. kreatinin 2,7 mg per dl (nilai rujukan 0,6-1,3 mg per dl). Pemeriksaan lab apakah untuk menegakkan tipe DM?","o":[["HbA1c","HbA1c menilai kontrol glikemik.",""],["Glukosa puasa","GDP untuk diagnosis.",""],["C Peptida darah","Benar: C-peptide menilai cadangan insulin endogen sehingga membedakan tipe 1 dan tipe 2.",""],["Mikroalbuminuri","Mikroalbuminuria menilai nefropati.",""],["Kreatinin","Kreatinin menilai fungsi ginjal.",""]],"a":2,"v":2,"r":0,"p":"C-peptide rendah → tipe 1; normal/tinggi → tipe 2.","k":"","t":"","n":"Koreksi kunci referensi: angkatan menandai A (HbA1c). Untuk menentukan TIPE DM, pemeriksaan yang tepat adalah C-peptide (soal no. 83 menanyakan kontrol glikemik, jawabannya HbA1c).","tag":"asli","lbl":"SOAL ASLI · UAM Articulatio","no":"59","ord":59},{"id":60,"ppt":"art-uam","topik":"Onkologi & petanda tumor","s":"Sel kanker melakukan proliferasi yang tidak terkendali, hal ini karena sel kanker mempunyai kemampuan dalam menghambat enzim yang berfungsi dalam mencegah pemendekan bagian dari kromosom. Apa enzim yang dimaksud ?","o":[["Metastase","Metastasis adalah proses, bukan enzim.",""],["Telomerase","Benar: telomerase mencegah pemendekan telomer; sel kanker MENGAKTIFKAN telomerase sehingga imortal.",""],["Sentromerisasi","Bukan enzim.",""],["Glutation peroksidase","Antioksidan.",""],["Katalase","Antioksidan.",""]],"a":1,"v":1,"r":1,"p":"Sel normal kehilangan telomer tiap pembelahan sampai senesens.","k":"","t":"","n":"Kalimat soal menyebut 'menghambat enzim'; yang benar sel kanker mengaktifkan telomerase.","tag":"asli","lbl":"SOAL ASLI · UAM Articulatio","no":"60","ord":60},{"id":61,"ppt":"art-uam","topik":"Rehabilitasi medik","s":"Pembatasan kemampuan untuk melakukan aktivitas normal disebut dengan apa ?","o":[["Kecacatan","Istilah umum.",""],["Impairment","Impairment: gangguan tingkat organ.",""],["Disabilitas","Benar: disabilitas = terbatasnya kemampuan melakukan aktivitas normal.",""],["Handicap","Handicap: gangguan peran sosial.",""],["Semua benar","Keliru.",""]],"a":2,"v":2,"r":2,"p":"Impairment (organ) → disabilitas (aktivitas) → handicap (peran sosial).","k":"","t":"","n":"Soal no. 62 di file identik dengan no. 61 dan digabung.","tag":"asli","lbl":"SOAL ASLI · UAM Articulatio","no":"61","ord":61},{"id":62,"ppt":"art-uam","topik":"Onkologi & petanda tumor","s":"Manakah pernyataan di bawah ini yang tidak benar ?","o":[["Faktor genetik berperan pada pertumbuhan ganas","Benar.",""],["DNA repair menghambat pertumbuhan ganas","Benar.",""],["Protoonkogen adalah gen abnormal yang dimiliki setiap individu","Benar sebagai jawaban: protoonkogen adalah gen NORMAL pengatur pertumbuhan.",""],["Onkogen ialah protoonkogen yang mengalami mutasi","Benar.",""],["Keganasan merupakan penyakit yang kompleks","Benar.",""]],"a":2,"v":2,"r":2,"p":"Protoonkogen termutasi → onkogen (gain of function); gen supresor tumor (loss of function).","k":"","t":"","n":"","tag":"asli","lbl":"SOAL ASLI · UAM Articulatio","no":"63","ord":63},{"id":63,"ppt":"art-uam","topik":"Radiologi","s":"Sinar x mempunyai beberapa sifat, Apa salah satu sifat sinar X yang digunakan pada pemeriksaan foto rontgen ?","o":[["Mengionisasi jaringan yang dilewati","Efek ionisasi dimanfaatkan pada radioterapi/dosimetri.",""],["Menghitamkan film/ fotografik","Benar: efek fotografik (menghitamkan film) dimanfaatkan pada foto rontgen.",""],["Memberikan efek radiasi","Efek radiasi umum.",""],["Menimbulkan efek biologic","Efek biologik dimanfaatkan radioterapi.",""],["Membutuhkan tegangan tinggi","Syarat produksi, bukan sifat.",""]],"a":1,"v":1,"r":1,"p":"Sifat sinar-X: daya tembus, efek fotografik, fluoresensi, ionisasi, biologik.","k":"","t":"","n":"","tag":"asli","lbl":"SOAL ASLI · UAM Articulatio","no":"64","ord":64},{"id":64,"ppt":"art-uam","topik":"Onkologi & petanda tumor","s":"Kemoterapi selain bertujuan untuk membunuh sel kanker, namun juga ada efek samping yang ditimbulkan yaitu memicu reaksi inflamasi. Oleh karena itu kemoterapi dilakukan dengan jadwal yang berjeda. Kenapa pada kemoterapi menggunakan jenis terapi intermitten ?","o":[["Untuk menghindari resistensi obat","Resistensi bukan alasan utama jeda.",""],["Untuk meningkatkan efek obat","Tidak meningkatkan efek.",""],["Untuk perbaikan sel yang mengalami kerusakan","Benar: jeda memberi waktu sel normal (sumsum tulang, mukosa) pulih.",""],["Untuk menghindari interaksi obat","Bukan alasan utama.",""],["Untuk meningkatkan efek toksik","Keliru.",""]],"a":2,"v":2,"r":2,"p":"Siklus kemoterapi disesuaikan dengan pemulihan sumsum tulang (nadir).","k":"","t":"","n":"","tag":"asli","lbl":"SOAL ASLI · UAM Articulatio","no":"65","ord":65},{"id":65,"ppt":"art-uam","topik":"Tiroid","s":"Seorang perempuan usia 60 tahun dating dengan keluhan pembesaran pada leher sejak 3 bulan yang lalu. Keluhan disertai nyeri. Pemeriksaan fisik didapatkan pembesaran difuse dan simetris pada kelenjar tiroid. Pada pemeriksaan mikroskopik ditemukan infiltarsi parenkim oleh folikel limfoid disertai germinal center, selebaran sel hurthle dan folikel thyroid tampak atrofi. Apakah diagnosis kasus tersebut?","o":[["Mixedema","Miksedema adalah manifestasi hipotiroid berat.",""],["Thyroiditis riedel","Riedel: fibrosis keras.",""],["Hyperthyroidism","Diagnosis fungsional, bukan histopatologi.",""],["Thyroiditis Hashimoto","Benar: folikel limfoid dengan germinal center, sel Hurthle, folikel atrofi = tiroiditis Hashimoto.",""],["Penyakit Grave","Graves: hiperplasia folikel.",""]],"a":3,"v":3,"r":3,"p":"Hashimoto: anti-TPO dan anti-tiroglobulin positif.","k":"","t":"","n":"","tag":"asli","lbl":"SOAL ASLI · UAM Articulatio","no":"66","ord":66},{"id":66,"ppt":"art-uam","topik":"Imunologi & inflamasi","s":"Seorang wanita hamil G3P0A2 datang dengan keluhan nyeri sendi. Dari pemeriksaan fisik didapatkan keadaan composmentis, tekanan darah 110 per 80mmHg, nadi 80x per menit laju nafas 20x per menit. Pada wajah pasien ditemukan juga kemerahan pada kedua sisi. Penderita memiliki riwayat keguguran sebanyak 2 kali. Oleh dokter yang bertugas penderita dicurigai menderita autoimun. Pemeriksaan koagulasi apa yang dapat dilakukan untuk membantu menegakkan diagnosis ?","o":[["Tes agregasi trombosit","Untuk antiplatelet.",""],["Hitung trombosit","Tidak spesifik.",""],["Protrombin time","PT kurang sensitif terhadap lupus antikoagulan.",""],["Tromboplastin time","Benar: lupus antikoagulan pada sindrom antifosfolipid memperpanjang aPTT (tromboplastin time).",""],["Trombin time","Tidak spesifik.",""]],"a":3,"v":3,"r":3,"p":"Sindrom antifosfolipid: keguguran berulang + trombosis + antibodi antifosfolipid, sering bersama SLE.","k":"","t":"","n":"","tag":"asli","lbl":"SOAL ASLI · UAM Articulatio","no":"67","ord":67},{"id":67,"ppt":"art-uam","topik":"Adrenal & kortikosteroid","s":"Obat steroid memiliki berbagai jenis berdasarkan onset dan lama kerja. Manakah dibawah ini yang merupakan derivat kortisol sintesis Deltakortikoid?","o":[["Betametason","Derivat fluorinasi.",""],["Deksametason","Derivat fluorinasi.",""],["Prednison","Benar: prednison/prednisolon adalah deltakortikoid (ikatan rangkap C1–C2).",""],["Triamsonolon","Derivat fluorinasi.",""],["Amiodaron","Antiaritmia, bukan steroid.",""]],"a":2,"v":2,"r":2,"p":"Deltakortikoid: prednison, prednisolon, metilprednisolon.","k":"","t":"","n":"","tag":"asli","lbl":"SOAL ASLI · UAM Articulatio","no":"68","ord":68},{"id":68,"ppt":"art-uam","topik":"Tiroid","s":"Seorang Wanita 50 tahun menderita obesitas dan DM tipe 2. Dokter meresepkan Metformin untuk wanita ini. Termasuk dalam golongan obat yang mekanisme kerjanya bagaimanakah metformin ini?","o":[["Meningkatkan transport glukosa yang dimediasi GLUT4 pada permukaan sel","Benar menurut referensi: metformin meningkatkan ambilan glukosa perifer (translokasi GLUT4) dan menurunkan produksi glukosa hati.",""],["Meningkatkan glukoneogenesis","Metformin justru menekan glukoneogenesis.",""],["Meningkatkan glikogenolisis","Tidak.",""],["Meningkatkan efek incretin saluran cerna","Efek inkretin: DPP-4 inhibitor/GLP-1 RA.",""],["Meningkatkan efek kenyang setelah makan","Efek GLP-1 RA.",""]],"a":0,"v":0,"r":0,"p":"Metformin aktivasi AMPK; efek utama menekan glukoneogenesis hati.","k":"","t":"","n":"","tag":"asli","lbl":"SOAL ASLI · UAM Articulatio","no":"69","ord":69},{"id":69,"ppt":"art-uam","topik":"Adrenal & kortikosteroid","s":"Obat steroid memiliki berbagai jenis berdasarkan onset dan lama kerja. Manakah dibawah ini obat kortikosteroid yang memiliki efek masa kerja sedang?","o":[["Betametason","Kerja panjang.",""],["Deksametason","Kerja panjang.",""],["Prednison","Benar: prednison kerja sedang (12–36 jam).",""],["Triamsonolon","Triamsinolon juga kerja sedang; lihat catatan.",""],["Hidrokortison","Kerja pendek.",""]],"a":2,"v":2,"r":2,"p":"Pendek: hidrokortison, kortison. Sedang: prednison, prednisolon, metilprednisolon, triamsinolon. Panjang: deksametason, betametason.","k":"","t":"","n":"Triamsinolon juga kerja sedang; kunci referensi C.","tag":"asli","lbl":"SOAL ASLI · UAM Articulatio","no":"70","ord":70},{"id":70,"ppt":"art-uam","topik":"Dislipidemia & sindrom metabolik","s":"Hiperkolesterol familial (HF) adalah Defek pada protein reseptor , Kelainan pada mutasi gen yang menjadi LDL. Dari ke 4 macam mutasi gen yang paling sering adalah salah satu:","o":[["I","Kelas I (null) juga sering.",""],["II","Benar: kelas II (gagal transport reseptor) paling sering.",""],["III","Kelas III: gagal mengikat LDL.",""],["IV","Kelas IV: gagal internalisasi.",""],["I dan II","Keliru.",""]],"a":1,"v":1,"r":1,"p":"Hiperkolesterolemia familial autosomal dominan, xantoma tendon.","k":"","t":"","n":"","tag":"asli","lbl":"SOAL ASLI · UAM Articulatio","no":"71","ord":71},{"id":71,"ppt":"art-uam","topik":"K3 & kesehatan lingkungan","s":"Dokter M di Puskesmas S mengadakan penyuluhan pada murid – murid SDN 2 Kota Z mengenai Perilaku Hidup Bersih dan Sehat (PHBS), mencuci tangan, dan menggosok gigi. Tindakan Dokter tersbut merupakan apa ?","o":[["Tindakan promotive","Benar: penyuluhan PHBS adalah promotif.",""],["Tindakan Preventive","Preventif misalnya imunisasi.",""],["Tindakan kuraftif","Kuratif: pengobatan.",""],["Tindakan Rehabilitatif","Rehabilitatif: pemulihan.",""],["Tindakan Adaptif","Bukan istilah tingkat pelayanan.",""]],"a":0,"v":0,"r":0,"p":"Five levels of prevention (Leavell-Clark): promosi kesehatan, proteksi spesifik, diagnosis dini, pembatasan cacat, rehabilitasi.","k":"","t":"","n":"","tag":"asli","lbl":"SOAL ASLI · UAM Articulatio","no":"72","ord":72},{"id":72,"ppt":"art-uam","topik":"Imunologi & inflamasi","s":"Apa perbadaan antara penyakit autoimun organ spesifik - non organ spesifik ?","o":[["Non organ spesifik Antigen tersebar seluruh tubuh, pada Organ Spesifik; terdapat dalam alat tubuh tertentu.","Benar: non-organ spesifik antigennya tersebar di seluruh tubuh; organ spesifik antigennya di organ tertentu.",""],["Organ spesifik Antigen tersebar seluruh tubuh, pada Non Organ Spesifik; terdapat dalam alat tubuh tertentu.","Terbalik.",""],["Kerusakan pada organ spesifik Penimbunan komplek sistemik terutama dalam ginjal, sendi dan kulit sedangkan kerusakan pada non organ spesifik kerusakan antigen dalam alat tubuh.","Terbalik.",""],["Overlap dengan antibodi organ spesifik dan penyakit lain, sedangkan overlap organ spesifik dengan antibodi non organ spesifik dan penyakit lain.","Keliru.",""],["Non organ spesifik Antigen tidak tersebar seluruh tubuh.","Keliru.",""]],"a":0,"v":0,"r":0,"p":"Contoh organ spesifik: Hashimoto; non-organ spesifik: SLE.","k":"","t":"","n":"","tag":"asli","lbl":"SOAL ASLI · UAM Articulatio","no":"73","ord":73},{"id":73,"ppt":"art-uam","topik":"Rehabilitasi medik","s":"IMPAIRMENT adalah suatu kehilangan atau abnormalitas psikologi, fisiologis atau struktur dan fungsi anatomis, contohnya apa ?","o":[["Stroke yang tidak mampu berpakaian sendiri","Disabilitas (aktivitas).",""],["Stroke dengan kelemahan pada otot-otot kaki","Benar: kelemahan otot kaki adalah gangguan tingkat organ (impairment).",""],["OA genu yang tdak mampu berjalan sendiri","Disabilitas.",""],["Decompenstio cordis dengan ketdakmampuan bangkit dari tempat tidur","Disabilitas.",""],["Semua benar","Keliru.",""]],"a":1,"v":1,"r":4,"p":"Impairment = organ; disabilitas = aktivitas.","k":"","t":"","n":"Koreksi kunci referensi: angkatan menandai E (semua benar). Opsi A, C, D adalah contoh disabilitas, jadi jawaban yang benar B.","tag":"asli","lbl":"SOAL ASLI · UAM Articulatio","no":"74","ord":74},{"id":74,"ppt":"art-uam","topik":"Tiroid","s":"Seorang wanita G1P0A0 usia kehamilan 8 minggu datang ke dokter dengan keluhan benjolan di leher sejak 2 bulan yang lalu. Dari pemeriksaan fisik didapatkan TD 120 per 80, HR 110x menit, RR 20x menit, Tax 37 C dan didapatkan nodul diffuse pada leher. Pada pemeriksaan fungsi tiroid pasien didiagnosa hipertiroid. Apa obat yang aman untuk kehamilan pasien ?","o":[["PTU","Benar: PTU pilihan pada trimester I (metimazol berisiko embriopati).",""],["Metimazol","Metimazol dipakai mulai trimester II.",""],["Propanolol","Simptomatik saja.",""],["Dexamethason","Tidak tepat.",""],["Iodida","Tidak tepat.",""]],"a":0,"v":0,"r":0,"p":"PTU trimester I, metimazol trimester II–III.","k":"","t":"","n":"","tag":"asli","lbl":"SOAL ASLI · UAM Articulatio","no":"75","ord":75},{"id":75,"ppt":"art-uam","topik":"Imunologi & inflamasi","s":"Apa sel imun yang melepaskan histamin sebagai mediator imunitas ?","o":[["Netrofil segmen","Neutrofil: fagositosis.",""],["Netrofil batang","Neutrofil muda.",""],["Limfosit T","Sel T: imunitas seluler.",""],["Basofil","Benar: basofil (dan sel mast) melepaskan histamin.",""],["Limfosit B","Sel B: antibodi.",""]],"a":3,"v":3,"r":3,"p":"Hipersensitivitas tipe I: IgE pada sel mast/basofil.","k":"","t":"","n":"","tag":"asli","lbl":"SOAL ASLI · UAM Articulatio","no":"76","ord":76},{"id":76,"ppt":"art-uam","topik":"Tiroid","s":"Laki-laki 28 tahun datang ke IGD RSWN dengan keluhan BB bertambah sejak 3 bulan yang lalu. Pada pemeriksaan fisik ditemukan moon face, buffalo hump, striae dan red face. Apakah kemungkinan diagnosis pasien tersebut?","o":[["Addison disesase","Addison: BB turun, hiperpigmentasi.",""],["Hipertiroidisme","Hipertiroid: BB turun.",""],["Dislipidemia","Tidak menjelaskan moon face.",""],["Cushing syndrome","Benar: moon face, buffalo hump, striae → Cushing syndrome.",""],["DM","Tidak menjelaskan.",""]],"a":3,"v":3,"r":3,"p":"Cushing: obesitas sentral, striae ungu, kelemahan otot proksimal.","k":"","t":"","n":"","tag":"asli","lbl":"SOAL ASLI · UAM Articulatio","no":"77","ord":77},{"id":77,"ppt":"art-uam","topik":"Dislipidemia & sindrom metabolik","s":"Seorang pasien laki-laki usia 55 tahun, menderita hipercholesterolemi sejak 5 tahun yang lalu. Saat ini pasien menkonsumsi simvastatin 20 mg sekali hari, pasien bekerja sebagai karyawan TU di kampus pada pemeriksaan fisik didapatkan BB 88 kg, TB 160 cm , status tanda vital dalam batas normal. Berapa kebutuhan kalori pasien per hari ?","o":[["2.640 kkal","Basal 30 kkal × 88 kg = 2.640.",""],["3.168 kkal","Basal + 20% aktivitas ringan = 3.168.",""],["3.036 kkal","Benar menurut referensi: 2.640 + 20% (aktivitas ringan, pegawai TU) − 5% (usia 40–59) = 3.036.",""],["3.640 kkal","Tidak sesuai.",""],["2.460 kkal","Tidak sesuai.",""]],"a":2,"v":2,"r":2,"p":"Hitungan referensi memakai BB aktual.","k":"","t":"","n":"PERKENI menganjurkan BB ideal (Broca) dan koreksi obesitas, sehingga hasilnya lebih kecil. Opsi hanya cocok dengan BB aktual; kunci mengikuti referensi.","tag":"asli","lbl":"SOAL ASLI · UAM Articulatio","no":"78","ord":78},{"id":78,"ppt":"art-uam","topik":"Gizi klinik","s":"Apa syarat diet pada penderita keganasan ?","o":[["Gizi baik : 35 kkal per kg BB utk laki-laki dan 32 kkal per kg BB utk perempuan. Gizi kurang : 40 kkal per kg BB utk laki-laki dan 36 kkal per kg BB utk perempuan.","Angka laki-laki gizi baik salah.",""],["Gizi baik : 36 kkal per kg BB utk laki-laki dan 32 kkal per kg BB utk perempuan. Gizi kurang : 40 kkal per kg BB utk laki-laki dan 36 kkal per kg BB utk perempuan.","Benar: gizi baik 36 (L)/32 (P); gizi kurang 40 (L)/36 (P) kkal/kgBB.",""],["Gizi baik : 36 kkal per kg BB utk laki-laki dan 30 kkal per kg BB utk perempuan. Gizi kurang : 40 kkal per kg BB utk laki-laki dan 36 kkal per kg BB utk perempuan.","Angka perempuan gizi baik salah.",""],["Gizi baik : 36 kkal per kg BB utk laki-laki dan 32 kkal per kg BB utk perempuan. Gizi kurang : 45 kkal per kg BB utk laki-laki dan 36 kkal per kg BB utk perempuan.","Angka gizi kurang laki-laki salah.",""],["Gizi baik : 36 kkal per kg BB utk laki-laki dan 32 kkal per kg BB utk perempuan. Gizi kurang : 40 kkal per kg BB utk laki-laki dan 35 kkal per kg BB utk perempuan.","Angka gizi kurang perempuan salah.",""]],"a":1,"v":1,"r":1,"p":"Slide Dietik Keganasan.","k":"","t":"","n":"","tag":"asli","lbl":"SOAL ASLI · UAM Articulatio","no":"79","ord":79},{"id":79,"ppt":"art-uam","topik":"Diabetes melitus","s":"Wanita usia 57 tahun, datang dengan keluhan tidak sadarkan diri. Dua hari sebelumnya riwayat muntah dan nyeri perut. Riwayat DM sejak 5 tahun yang lalu. Tensi 120 per 80 mmHg, HR 100x per menit, RR 40x per menit, nafas cepat dan dalam serta suhu 38 C. Ditemukan GDS 520 mg, AGD Ph 7,1 pCO2 16,80 pO2 107,2 BE -21,8 HCO3 5,3 dan saturari 94 persen. Berapa target penurunan gula darah yang tepat ?","o":[["10-30","Terlalu lambat.",""],["30-50","Masih di bawah target.",""],["50-70","Benar: penurunan glukosa ± 50–70 mg/dL/jam pada KAD.",""],["70-100","Terlalu cepat.",""],["100-120","Terlalu cepat, risiko edema serebri.",""]],"a":2,"v":2,"r":null,"p":"KAD: insulin 0,1 U/kgBB/jam; bila glukosa ± 200–250 tambahkan dekstrosa.","k":"","t":"","n":"Referensi angkatan tidak menandai jawaban; kunci dari pedoman tatalaksana KAD.","tag":"asli","lbl":"SOAL ASLI · UAM Articulatio","no":"80","ord":80},{"id":80,"ppt":"art-uam","topik":"Diabetes melitus","s":"Seorang laki-laki berusia 50 tahun datang ke praktek dokter dengan membawa hasil pemeriksaan laboratorium. Dari anamnesis pasien mengeluh sering lapar, sering haus dan bolak balik ke kamar mandi. Orang tua pasien memiliki riwayat DM. pemeriksaan fisik dalam batas normal. Hasil pemeriksaan laboratorium didapatkan gula darah puasa 99 mg per dL, hasil tes toleransi gula darah 160 mg per dL. Apakah diagnosis yg paling tepat ?","o":[["Normal","Nilai TTGO tidak normal.",""],["DM tipe I","Tidak sesuai.",""],["DM tipe II","Belum memenuhi kriteria DM.",""],["Toleransi glukosa terganggu","Benar: GDP 99 normal, TTGO 160 (140–199) → TGT.",""],["Toleransi glukosa puasa terganggu","GDP normal sehingga bukan GDPT.",""]],"a":3,"v":3,"r":3,"p":"Kriteria: GD2PP 140–199 = TGT; GDP 100–125 = GDPT.","k":"","t":"","n":"","tag":"asli","lbl":"SOAL ASLI · UAM Articulatio","no":"81","ord":81},{"id":81,"ppt":"art-uam","topik":"Diabetes melitus","s":"Manakah yang termasuk insulin kerja cepat atau Rapid acting insulin?","o":[["Insulin Humulin","Humulin R adalah insulin kerja pendek.",""],["Insulin Glargine","Glargine: kerja panjang.",""],["Insulin Lispro","Benar: lispro (juga aspart, glulisin) adalah kerja cepat.",""],["Lantus","Lantus = glargine, kerja panjang.",""],["NovomiX","Novomix = premix.",""]],"a":2,"v":2,"r":2,"p":"Rapid: lispro, aspart, glulisin.","k":"","t":"","n":"","tag":"asli","lbl":"SOAL ASLI · UAM Articulatio","no":"82","ord":82},{"id":82,"ppt":"art-uam","topik":"Diabetes melitus","s":"Seorang pria usia 65 tahun dengan keluhan kencing terus. Hasil pemeriksaan Glukosa darah sewaktu 225 mg per dl, reduksi urin positif 1, protein urin positif 2. kreatinin 2,7 mg per dl (nilai rujukan 0,6-1,3 mg per dl). Pemeriksaan lab apakah untuk mengetahui Kadar glukosa darah ybs terkontrol atau tidak?","o":[["HbA1c","Benar: HbA1c menilai kontrol glikemik 2–3 bulan.",""],["Glukosa puasa","Sesaat.",""],["C Peptida darah","Untuk tipe DM.",""],["Mikroalbuminuri","Nefropati.",""],["Kreatinin","Fungsi ginjal.",""]],"a":0,"v":0,"r":0,"p":"Slide: HbA1c kurang andal bila fungsi ginjal terganggu; alternatifnya glycated albumin.","k":"","t":"","n":"","tag":"asli","lbl":"SOAL ASLI · UAM Articulatio","no":"83","ord":83},{"id":83,"ppt":"art-uam","topik":"Gizi klinik","s":"Lemak tidak jenuh tunggal lebih tahan terhadap proses oksidasi, contohnya, kecuali apa ?","o":[["Minyak kacang","MUFA (dan PUFA).",""],["Minyak sawit","Benar sebagai jawaban: minyak sawit kaya lemak jenuh (palmitat).",""],["Minyak kanola","MUFA.",""],["Minyak zaitun","MUFA tinggi (oleat).",""],["Minyak kacang","Sama dengan A.",""]],"a":1,"v":1,"r":1,"p":"MUFA: zaitun, kanola, kacang, alpukat.","k":"","t":"","n":"","tag":"asli","lbl":"SOAL ASLI · UAM Articulatio","no":"84","ord":84},{"id":84,"ppt":"art-uam","topik":"Tiroid","s":"Seorang wanita usia 50 tahun datang ke dokter dengan keluhan benjolan di leher sejak 3 bulan terakhir. Pasien juga mengeluhkan telapak tangan sering berair dan berat badan turun drastis. Dari pemeriksaan fisik didapatkan TD 120 per 80, HR 110x menit, RR 20x menit, Tax 37 C dan didapatkan nodul diffuse pada leher. Dokter memberikan obat yang berperan dalam merubah T4 menjadi T3 pada jaringan perifer. Apa jenis obat yang dimaksud ?","o":[["PTU","Benar: PTU menghambat deiodinase perifer (konversi T4 → T3).",""],["Levotiroksin","Hormon tiroid.",""],["Propanolol","Propranolol dosis tinggi juga sedikit menghambat konversi, tetapi PTU paling khas.",""],["Dexamethason","Glukokortikoid juga menghambat konversi pada krisis tiroid.",""],["Metimazole","Metimazol tidak menghambat konversi perifer.",""]],"a":0,"v":0,"r":0,"p":"PTU dipilih pada krisis tiroid karena efek perifer ini.","k":"","t":"","n":"","tag":"asli","lbl":"SOAL ASLI · UAM Articulatio","no":"85","ord":85},{"id":85,"ppt":"art-uam","topik":"Adrenal & kortikosteroid","s":"Keadaan hipernatremia yang disebabkan oleh kehilangan cairan berlebihan terdapat pada keadaan apa ?","o":[["Diabetes insipidus","Benar: diabetes insipidus → diuresis air berlebih → hipernatremia.",""],["Diabetes mellitus","Hiperglikemia dapat menyebabkan diuresis osmotik, tetapi khas DI.",""],["Asidosis metabolic","Tidak.",""],["Hiperaldosteronisme","Hiperaldosteron: retensi Na (hipernatremia ringan), bukan akibat kehilangan cairan.",""],["Sindrom cushing","Tidak.",""]],"a":0,"v":0,"r":0,"p":"DI sentral (ADH kurang) atau nefrogenik (resisten ADH).","k":"","t":"","n":"","tag":"asli","lbl":"SOAL ASLI · UAM Articulatio","no":"86","ord":86},{"id":86,"ppt":"art-uam","topik":"Onkologi & petanda tumor","s":"Sel kanker dapat mempunyai kemampuan dalam menginvasi jaringan sekitar. Pertumbuhan yang tidak terkendali ini terjadi karena mutasi pada tumor supresor gen. Gen p53 ditemukan banyak terjadi mutasi pada kasus keganasan. Apa fungsi gen p53 dalam hal membuat siklus sel berhenti ?","o":[["Menghambat ciklin dependen kinase","Benar: p53 menginduksi p21 yang menghambat CDK sehingga siklus berhenti di G1.",""],["Mengaktifkan ciklin dependen kinase","Kebalikannya.",""],["Menginduksi repair DNA","p53 juga menginduksi repair DNA, tetapi penghentian siklus melalui hambatan CDK.",""],["Menginduksi apoptosis","Apoptosis bila DNA tidak bisa diperbaiki.",""],["Menginduksi inflamasi","Tidak.",""]],"a":0,"v":0,"r":2,"p":"p53 'penjaga genom': henti siklus (p21), repair DNA, apoptosis.","k":"","t":"","n":"Koreksi kunci referensi: angkatan menandai C (repair DNA). Soal menanyakan mekanisme MENGHENTIKAN siklus, yaitu menghambat CDK melalui p21.","tag":"asli","lbl":"SOAL ASLI · UAM Articulatio","no":"87","ord":87},{"id":87,"ppt":"art-uam","topik":"K3 & kesehatan lingkungan","s":"Seorang laki-laki mengeluh batuk berdahak sudah 1 bulan, kemudian didiagnosis TBC. Pasien bekerja di rumah makan. Pasien merupakan tulang punggung keluarganya. Sebagai dokter yang memiliki kode etik, apa yang karena membiayai istri, 2 orang anak dan kedua orang tuanya. Apa yang harus dokter lakukan?","o":[["Menyarankan pasien untuk berhenti kerja karena bisa menular ke orang lain","Tidak etis tanpa penilaian.",""],["Memberitahu pemimpin tempat kerja bahwa pasien terkena tbc","Melanggar kerahasiaan.",""],["Memberitahu pasien tentang resiko penularan dan menyarankan untuk mengikuti pengobatan sampai tuntas","Benar: edukasi risiko penularan dan kepatuhan pengobatan sampai tuntas.",""],["Mencampuri urusan pribadi pasien","Tidak tepat.",""],["Merahasiakan penyakit pasien dari keluarga","Keluarga perlu tahu untuk skrining kontak.",""]],"a":2,"v":2,"r":2,"p":"Kode etik: kerahasiaan dengan kewajiban melindungi kesehatan masyarakat.","k":"","t":"","n":"","tag":"asli","lbl":"SOAL ASLI · UAM Articulatio","no":"88","ord":88},{"id":88,"ppt":"art-uam","topik":"Tiroid","s":"Seorang pria usia 45 tahun datang ke dokter dengan keluhan benjolan di leher sejak 1 tahun terakhir. Pasien juga mengeluhkan berdebar-debar dan mudah gelisah. Dari pemeriksaan fisik didapatkan TD 120 per 80, HR 140x menit, RR 20x menit, Tax 37,5 C dan didapatkan nodul diffuse pada leher. Paien direncanakan untuk operasi. Apa tatalaksana yang tepat untuk pasien tersebut untuk mengurangi komplikasi perdarahan saat operasi ?","o":[["PTU","Untuk mencapai eutiroid.",""],["Levotiroksin","Untuk hipotiroid.",""],["Propanolol","Simptomatik.",""],["Iodida","Benar: iodida (Lugol) 7–10 hari praoperasi mengurangi vaskularisasi kelenjar sehingga perdarahan berkurang.",""],["Metimazole","Untuk mencapai eutiroid.",""]],"a":3,"v":3,"r":3,"p":"Efek Wolff-Chaikoff.","k":"","t":"","n":"","tag":"asli","lbl":"SOAL ASLI · UAM Articulatio","no":"89","ord":89},{"id":89,"ppt":"art-uam","topik":"Hemostasis & hemodinamika","s":"Peristiwa mekanis dari siklus jantung, yaitu systolic dan diastolic. Manakah pernyataan yang salah mengenai hal ini ?","o":[["Mid-Diastolic adalah Fase pengisian sangat cepat pada ventrikel.","Benar sebagai jawaban: pengisian cepat terjadi pada AWAL diastol; mid-diastol adalah pengisian lambat (diastasis).",""],["Atrium dan ventrikel dalam keadaan istirahat.","Benar.",""],["Darah dari Atrium mengalir secara pasif ke Ventrikel melalui katup AV yang terbuka.","Benar.",""],["Katup semilunaris dalam keadaan tertutup.","Benar.",""],["Diastolic-lanjut yaitu Gelombang depolarisasi menyebar melalui Atrium dan berhenti sementara pada AV node","Benar.",""]],"a":0,"v":0,"r":0,"p":"Fase siklus jantung: kontraksi isovolumik, ejeksi, relaksasi isovolumik, pengisian cepat, diastasis, kontraksi atrium.","k":"","t":"","n":"","tag":"asli","lbl":"SOAL ASLI · UAM Articulatio","no":"90","ord":90},{"id":90,"ppt":"art-uam","topik":"Adrenal & kortikosteroid","s":"Obat steroid memiliki berbagai jenis berdasarkan onset dan lama kerja. Manakah efek mineralokortikoid dari penggunaan obat kortikosteroid?","o":[["Osteoporosis","Efek glukokortikoid.",""],["Hipokalemia","Benar: efek mineralokortikoid → retensi Na, hipokalemia.",""],["Imunosupresi", atkan nodul diffuse pada leher. Apa jenis terapi yang paling tepat untuk pasien tersebut ? (Hipertiroid)","o":[["Tiroglobulin","Prekursor, bukan obat.",""],["Liotironine","T3 sintetik, bukan pilihan rumatan.",""],["Liotrik","Kombinasi T4/T3, bukan pilihan utama.",""],["Levotiroksin","Benar: levotiroksin adalah terapi pengganti hipotiroid/goiter.",""],["Diodotironin","Bukan obat.",""]],"a":3,"v":3,"r":3,"p":"Pegunungan (defisiensi yodium), konsumsi kubis (goitrogen), kulit kering, lelah → hipotiroid/goiter.","k":"","t":"","n":"File menulis '(Hipertiroid)' di akhir soal; gejalanya justru hipotiroid. Kunci levotiroksin tetap benar.","tag":"asli","lbl":"SOAL ASLI · UAM Articulatio","no":"94","ord":94},{"id":94,"ppt":"art-uam","topik":"Onkologi & petanda tumor","s":"Pada pasien kanker stadium IV dengan keadaan umum yang buruk, dan mengalami anemia berat. Apa pilihan terapi yang paling baik adalah ?","o":[["Radioterapi","Tidak tepat pada KU buruk.",""],["Kemoterapi","Toksik.",""],["Palliative","Benar: terapi paliatif untuk kualitas hidup.",""],["Pembedahan","Tidak operabel.",""],["Transpalantasi","Tidak relevan.",""]],"a":2,"v":2,"r":2,"p":"Paliatif mencakup nyeri, transfusi, nutrisi, psikososial.","k":"","t":"","n":"","tag":"asli","lbl":"SOAL ASLI · UAM Articulatio","no":"95","ord":95},{"id":95,"ppt":"art-uam","topik":"Tiroid","s":"Seorang wanita pasca melahirkan 1 hari yang lalu. Saat hamil mengalami kondisi hipertiroid dan rutin minum obat. Dari pemeriksaan fisik didapatkan TD 120 per 80, HR 110x menit, RR 20x menit, Tax 37 C dan didapatkan nodul diffuse pada leher. Apa tatalaksana yang tepat untuk pasien tersebut setelah pasien melahirkan ?","o":[["PTU","PTU masih boleh, tetapi bukan pilihan utama setelah trimester I.",""],["Metimazol","Benar: pascapersalinan dan menyusui, metimazol (≤ 20 mg/hari) adalah pilihan.",""],["Propanolol","Simptomatik.",""],["Dexamethason","Tidak tepat.",""],["Levotiroksin","Untuk hipotiroid.",""]],"a":1,"v":1,"r":1,"p":"PTU hanya diutamakan ksi oleh antibodi terhadap antigen pada permukaan erythrosit","<b>Keterangan:<\/b> autoantibodi antierytrosit. Benar: AHA = destruksi eritrosit oleh autoantibodi terhadap antigen permukaan eritrosit.",""]],"a":4,"v":4,"r":4,"p":"Uji Coombs direk positif.","k":"","t":"","n":"","tag":"asli","lbl":"SOAL ASLI · UAS Articulatio","no":"29","ord":29},{"id":129,"ppt":"art-uas","topik":"Imunologi & inflamasi","s":"Apa nama Posisi x Foto untuk melihat sinus paranasal ?","o":[["Waters","Benar: posisi Waters (occipitomental) untuk sinus maksilaris.",""],["Schuller","Schuller: mastoid.",""],["Rheese","Rhese: foramen optikum.",""],["Eisler","Eisler: mandibula.",""],["Stenver","Stenvers: piramid os petrosum.",""]],"a":0,"v":0,"r":0,"p":"Caldwell: sinus frontal dan etmoid.","k":"","t":"","n":"","tag":"asli","lbl":"SOAL ASLI · UAS Articulatio","no":"30","ord":30},{"id":130,"ppt":"art-uas","topik":"Adrenal & kortikosteroid","s":"Obat kortikosteroid merupakan bentuk sintesis dari hormone steroid yang dihasilkan oleh glandula Suprarenalis. Manakah bagian dari Glandula Suprarenalis yang menghasilkan hormon Mineralokortikoid?","o":[["Medulla","Medula: katekolamin.",""],["Korteks Pars Glomerulosa","Benar: zona glomerulosa → aldosteron.",""],["Korteks Pars Fasciculata","Fasikulata: kortisol.",""],["Korteks Pars Reticularis","Retikularis: androgen.",""],["Korteks Renalis","Bukan bagian adrenal.",""]],"a":1,"v":1,"r":1,"p":"Salt–sugar–sex.","k":"","t":"","n":"","tag":"asli","lbl":"SOAL ASLI · UAS Articulatio","no":"31","ord":31},{"id":131,"ppt":"art-uas","topik":"Imunologi & inflamasi","s":"Berikut merupakan faktor humoral dalam respons imun non spesifik, Manakah yang tidak termasuk ?","o":[["CRP","Humoral nonspesifik.",""],["Komplemen","Humoral nonspesifik.",""],["Lisosim","Humoral nonspesifik (enzim).",""],["Limfosit B","Benar sebagai jawaban: limfosit B adalah seluler spesifik (adaptif).",""],["Laktoferin","Humoral nonspesifik.",""]],"a":3,"v":3,"r":3,"p":"Faktor humoral nonspesifik: komplemen, CRP, lisozim, interferon, laktoferin.","k":"","t":"","n":"","tag":"asli","lbl":"SOAL ASLI · UAS Articulatio","no":"32","ord":32},{"id":132,"ppt":"art-uas","topik":"Imunologi & inflamasi","s":"Manakah pernyataan yang salah mengenai Polimiositis atau dermatomiositis ?","o":[["Penyakit autoimun organ","Pernyataan sesuai slide.",""],["Polimiositis merupakan peradangan otot skelet diperantarai kelainan Imunologik.","Benar.",""],["Klinik berupa kelemahan otot bilateral atau Simetrik.","Benar.",""],["Oleh karena kerusakan serabut otot oleh sel T sitotoxic yang memasuki dan mengitari serabut otot.","Benar.",""],["Penyakit autoimun sistemik","Jawaban referensi: polimiositis digolongkan autoimun organ (otot) di slide.",""]],"a":4,"v":4,"r":4,"p":"Slide membagi penyakit autoimun menjadi organ spesifik vs sistemik.","k":"","t":"","n":"Beberapa buku menggolongkan polimiositis sebagai autoimun sistemik. Opsi A dan E saling bertentangan; kunci mengikuti referensi (E).","tag":"asli","lbl":"SOAL ASLI · UAS Articulatio","no":"33","ord":33},{"id":133,"ppt":"art-uas","topik":"Onkologi & petanda tumor","s":"Manakah Klasifikasi atas dasar sel atau jaringan (histogenesis) pada tumor ?","o":[["Tumor Sel Totipoten sel yang dapat berdiferensiasi kedalam tiap jenis sel tubuh.","Benar.",""],["Tumor sel embrional pluripoten tumor yang dapat berdiferensiasi ke dalam berbagai jenis sel.","Benar.",""],["Pada pluripoten sebagian tumor yang akan membentuk berbagai jenis struktur alat tubuh.","Benar.",""],["Tumor sel yang berdiferensiasi jenis sel yang terdapat dalan bentuk sel alat-alat tubuh pada kehidupan postnatal.","Benar.",""],["Semua benar","Benar: semua termasuk klasifikasi histogenesis.",""]],"a":4,"v":4,"r":4,"p":"Contoh totipoten: teratoma.","k":"","t":"","n":"","tag":"asli","lbl":"SOAL ASLI · UAS Articulatio","no":"34","ord":34},{"id":134,"ppt":"art-uas","topik":"Diabetes melitus","s":"Seorang perempuan berusia 52 tahun datang untuk kontrol penyakitnya ke poliklinik jantung dan pembuluh darah. 2 minggu yang lalu pasien baru saja mengalami serangan jantung dan di rawat di ICU selama 5 hari. Diketahui pasien memiliki riwayat kolestrol tinggi dan DM. Pada pemeriksaan fisik tanda vital TD 10/90 mmHg, HR 89x/menit , RR 23x/menit, suhu 37 C. Pada pemeriksaan darah, didaatkan kadar kolestrol 250 mg/dL ,LDL 170 mg/dL. Apa Tatalaksana dislipidemia yang tepat pada pasien tersebut ?","o":[["Atorvastatin 1x40 mg","Benar: pasca-SKA → statin intensitas tinggi (atorvastatin 40–80 mg).",""],["Rosuvastatin 1x5mg","Rosuvastatin 5 mg intensitas rendah-sedang.",""],["Simvastatin1x20mg","Simvastatin 20 mg intensitas rendah-sedang.",""],["Allopurinol 1x100mg","Allopurinol bukan penurun lipid.",""],["Atorvastatin 1x20mg","Atorvastatin 20 mg intensitas sedang.",""]],"a":0,"v":0,"r":2,"p":"Statin intensitas tinggi: atorvastatin 40–80 mg, rosuvastatin 20–40 mg.","k":"","t":"","n":"Koreksi kunci referensi: angkatan menandai C. Pasien sangat berisiko tinggi (baru SKA + DM) → pedoman PERKI/ESC menganjurkan statin intensitas tinggi.","tag":"asli","lbl":"SOAL ASLI · UAS Articulatio","no":"35","ord":35},{"id":135,"ppt":"art-uas","topik":"Diabetes melitus","s":"Laki-laki usia 53 tahun datang ke praktik dokter dengan keluhan gula darah tetap tinggi meskipun sudah menjalani pengaturan diet diabetes dan olahraga. Pasien sudah didiagnosis menderita DM sejak 1 tahun yang lalu. Pada pemeriksaan fisik didapatkan BB 100 kg, TB 163 cm. Pemeriksaan laboratorium ditemukan kadar glukosa darah sewaktu 290 mg per dL. Apakah penatalaksanaan selanjutnya yang paling tepat pada pasien ini?","o":[["Diet diabetes + glibenclamid 1x2,5 mg sebelum makan pagi","Tanpa olahraga; sulfonilurea memicu kenaikan BB.",""],["Diet diabetes + metformin 3x500mg","Tanpa olahraga.",""],["Diet diabetes + olahraga + glibenclamide 1x 2.5 mg sebelum makan pagi","Sulfonilurea kurang tepat pada obesitas.",""],["Diet diabetes + olahraga + injeksi insulin 3x6 unit SC setiap akan makan","Insulin belum perlu tanpa dekompe embulat dan semakin bertambah gemuk sejak 3 bulan terakhir. Pasien juga mengeluhkan badan terasa lemas dan muncul garis-garis merah pada perut dan paha. Pasien mengaku tidak sedang mengkonsumsi obat apapun. Pada pemeriksaan fisik didapatkan IMT: 30, TD: 180/100 mmHg, N:70x/menit, RR:20 x/menit, S: 36,0, striae (+). Pada saat diberikan deksametasone dosis tinggi didapatkan penurunan kortisol. Kelenjar apakah yang membentuk kortisol?","o":[["Hipofisis anterior","Penghasil ACTH.",""],["Tiroid","Tiroid.",""],["Pankreas","Insulin.",""],["Adrenal","Benar: kortisol dibentuk korteks adrenal.",""],["Gonad","Gonad.",""]],"a":3,"v":3,"r":3,"p":"Supresi dengan deksametason dosis tinggi → Cushing disease (hipofisis).","k":"","t":"","n":"","tag":"asli","lbl":"SOAL ASLI · UAS Articulatio","no":"74","ord":74},{"id":174,"ppt":"art-uas","topik":"Onkologi & petanda tumor","s":"Manakah jenis obat yang masuk kategori inhibitor tirosin kinase ?","o":[["Rapalog","Jawaban referensi: rapalog (mTOR inhibitor, kinase serin/treonin).",""],["Ofaparib","Olaparib: PARP inhibitor.",""],["Rituximab","Anti-CD20.",""],["Doxorubisin","Antrasiklin.",""],["Cyclosporin","Imunosupresan.",""]],"a":0,"v":0,"r":0,"p":"Slide menggolongkan rapalog bersama penghambat kinase.","k":"","t":"","n":"Tidak ada TKI klasik di opsi; kunci mengikuti referensi.","tag":"asli","lbl":"SOAL ASLI · UAS Articulatio","no":"75","ord":75},{"id":175,"ppt":"art-uas","topik":"Rehabilitasi medik","s":"Seorang atlit datang memeriksakan diri ke dokter Sp.KFR dikarenakan mengalami cidera pada regio ankle joint dextra, maka dokter Sp.KFR akan memberikan terapi berupa modalitas dan exercise dibantu oleh siapa ?","o":[["Fisioterapis","Benar: fisioterapis memberikan modalitas dan exercise.",""],["Social Worker","Sosial.",""],["Psikolog","Psikis.",""],["Terapis Wicara","Bicara/menelan.",""],["Perawat","Perawatan.",""]],"a":0,"v":0,"r":0,"p":"Tim rehabilitasi: Sp.KFR, fisioterapis, okupasi, wicara, ortotis, psikolog, sosial.","k":"","t":"","n":"","tag":"asli","lbl":"SOAL ASLI · UAS Articulatio","no":"76","ord":76},{"id":176,"ppt":"art-uas","topik":"Onkologi & petanda tumor","s":"Neoplasma dapat dibedakan menjadi jinak atau ganas. Manakah yang tidak termasuk ?","o":[["Differensiasi dan anaplasia","Kriteria.",""],["Kecepatan pertumbuhan","<b>Keterangan:<\/b> rate of growth. Kriteria.",""],["Invasilokal","<b>Keterangan:<\/b> local invasion. Kriteria.",""],["Metastasis","<b>Keterangan:<\/b> anaksebar. Kriteria.",""],["Metastasis bukan termasuk kriteria","Benar sebagai jawaban: metastasis termasuk kriteria.",""]],"a":4,"v":4,"r":4,"p":"Metastasis = kriteria pasti keganasan.","k":"","t":"","n":"","tag":"asli","lbl":"SOAL ASLI · UAS Articulatio","no":"77","ord":77},{"id":177,"ppt":"art-uas","topik":"Tiroid","s":"Seorang wanita G1P0A0 usia kehamilan 8 minggu datang ke dokter dengan keluhan benjolan di leher sejak 2 bulan yang lalu. Dari pemeriksaan fisik didapatkan TD 120/80, HR 110x/menit, RR 20x/menit, Tax 37°C dan didapatkan nodul diffuse pada leher. Pada pemeriksaan fungsi tiroid pasien didiagnosa hipotiroid. Selain diberikan obat hipotiroid pasien juga diberikan asam folat dan vitamin B12. Bagaimana cara yang harus dilakukan agar tidak terjadi interaksi obat ?","o":[["Meminum obat setelah makan","Levotiroksin justru diminum saat perut kosong.",""],["Meminum obat tiroid 6 jam setelah minum vitamin","Interval terlalu panjang.",""],["Meminum obat tiroid 2 jam sebelum minum vitamin","Benar menurut referensi: levotiroksin dahulu, vitamin kemudian.",""],["Meminum vitamin 6 jam setelah minum obat tiroid","Tidak sesuai referensi.",""],["Meminum bersamaan dengan makan","Makanan mengganggu absorpsi.",""]],"a":2,"v":2,"r":2,"p":"Pisahkan dengan suplemen besi/kalsium minimal 4 jam.","k":"","t":"","n":"","tag":"asli","lbl":"SOAL ASLI · UAS Articulatio","no":"78","ord":78},{"id":178,"ppt":"art-uas","topik":"Tiroid","s":"Seorang pria usia 45 tahun datang ke dokter dengan keluhan berdebar-debar dan gelisah sejak 1 bulan te -uas","topik":"Tiroid","s":"Seorang wanita usia 28 tahun dengan benjolan didepan leher, sering merasa panas, gemetar, makan banyak tapi tetap kurus, sering berdebar debar. Hasil pemeriksaan TSH 0,22 MIU per L, FT4 4,5 ng per dl. Berdasarkan gejala klinis, apa diagnosa sementaranya ?","o":[["Hipotiroid","Kebalikan.",""],["Hipertiroid","Benar: TSH rendah, FT4 tinggi → hipertiroid.",""],["Tiroiditis Hashimoto","Etiologi.",""],["Graves disease","Etiologi.",""],["Goiter","Anatomis.",""]],"a":1,"v":1,"r":1,"p":"Diagnosis sementara = fungsional.","k":"","t":"","n":"","tag":"asli","lbl":"SOAL ASLI · UAS Articulatio","no":"82","ord":82},{"id":182,"ppt":"art-uas","topik":"Gizi klinik","s":"Pada syarat diet selain energi juga dibutuhkan nutrisi berupa apa ?","o":[["Protein tinggi, yaitu 1,5- 2 gr per kgBB","Terlalu tinggi.",""],["Lemak rendah, yaitu 20-25 persen dari kebutuhan energi total","Lemak sedang (20–25%) menurut referensi.",""],["Protein tinggi, yaitu 1-1,5 gr per kgBB","Benar menurut referensi: protein 1–1,5 g/kgBB.",""],["Lemak sedang yaitu 20-25 persen dari kebutuhan energi total","Pengecoh.",""],["Salah semua","Keliru.",""]],"a":2,"v":2,"r":2,"p":"Konteks soal: syarat diet keganasan/katabolik.","k":"","t":"","n":"","tag":"asli","lbl":"SOAL ASLI · UAS Articulatio","no":"83","ord":83},{"id":183,"ppt":"art-uas","topik":"Tiroid","s":"Seorang pria usia 45 tahun datang ke dokter dengan keluhan benjolan di leher sejak 1 tahun terakhir. Pasien juga mengeluhkan berdebar-debar dan mudah gelisah. Dari pemeriksaan fisik didapatkan TD 120/80, HR 140x/menit, RR 20x/menit, Tax 37,5°C dan didapatkan nodul diffuse pada leher. Apa tatalaksana yang tepat untuk pasien tersebut untuk mengurangi keluhan berdebarnya ?","o":[["PTU 3x100 mg","Antitiroid.",""],["Metimazol 3x10 mg","Antitiroid.",""],["Propanolol 3x10mg","Benar: propranolol untuk keluhan adrenergik (berdebar).",""],["Dexamethason 3x0.5mg","Tidak tepat.",""],["Metimazol 1x20mg","Antitiroid.",""]],"a":2,"v":2,"r":2,"p":"β-blok
