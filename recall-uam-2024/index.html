<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recall UAM 3.2 2024</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6f8;--paper:#ffffff;--ink:#16202a;--muted:#5d6b78;--line:#dfe4ea;--soft:#eef2f6;
  --brand:#0f6e6a;--brand-soft:#e2f2f0;--accent:#c2410c;--accent-soft:#fdeee5;
  --good:#15803d;--good-soft:#e5f5ea;--bad:#b91c1c;--bad-soft:#fdeaea;--warn:#a16207;--warn-soft:#fdf6dc;
  --flag:#7c3aed;--flag-soft:#f1eafe;--hema:#0f6e6a;--hema-soft:#e2f2f0;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.06);
  --sans:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1418;--paper:#171e24;--ink:#e6edf3;--muted:#98a6b3;--line:#2a343d;--soft:#1e272e;
  --brand:#4fd1c5;--brand-soft:#123432;--accent:#fb923c;--accent-soft:#3a2416;
  --good:#4ade80;--good-soft:#14301f;--bad:#f87171;--bad-soft:#3a1a1a;--warn:#facc15;--warn-soft:#352c0f;
  --flag:#c4b5fd;--flag-soft:#2a2142;--hema:#4fd1c5;--hema-soft:#123432;--shadow:none}}
:root[data-theme="dark"]{
  --bg:#0f1418;--paper:#171e24;--ink:#e6edf3;--muted:#98a6b3;--line:#2a343d;--soft:#1e272e;
  --brand:#4fd1c5;--brand-soft:#123432;--accent:#fb923c;--accent-soft:#3a2416;
  --good:#4ade80;--good-soft:#14301f;--bad:#f87171;--bad-soft:#3a1a1a;--warn:#facc15;--warn-soft:#352c0f;
  --flag:#c4b5fd;--flag-soft:#2a2142;--hema:#4fd1c5;--hema-soft:#123432;--shadow:none}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1080px;margin:0 auto;padding:16px}
header.top{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-top:10px;padding-bottom:10px}
.logo{font-weight:800;font-size:17px;letter-spacing:-.2px}
.logo span{color:var(--brand)}
.sp{flex:1}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;min-height:40px}
.btn:hover{border-color:var(--brand)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
:root[data-theme="dark"] .btn.pri{color:#06201e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.pri{color:#06201e}}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;min-height:32px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.icon-btn{border:1px solid var(--line);background:var(--paper);border-radius:10px;width:40px;height:40px;display:grid;place-items:center}
h1,h2,h3{line-height:1.25;margin:0}
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin:8px 0 20px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.panel h2{font-size:18px;margin-bottom:6px}
.muted{color:var(--muted)}
.small{font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.stat{background:var(--soft);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:4px;margin:10px 0}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
select,input[type=number]{font:inherit;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:40px}
.chips{display:flex;flex-wrap:wrap;gap:6px;max-height:190px;overflow:auto;padding:2px}
.chip{border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12.5px;background:var(--paper);user-select:none}
.chip.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand);font-weight:600}
.lp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:720px){.lp-grid{grid-template-columns:1fr 1fr}}
.bag-btns{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 6px}
.resume{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--brand-soft);border:1px solid var(--brand);border-radius:14px;padding:12px 14px;margin:0 0 16px}
.sect-t{display:flex;align-items:baseline;gap:10px;margin:22px 0 10px}
.sect-t h2{font-size:17px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.card h3{font-size:15.5px}
.card .meta{font-size:12.5px;color:var(--muted)}
.bar{height:6px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand)}
.topics{display:none;border-top:1px dashed var(--line);padding-top:8px}
.topics.open{display:block}
.topics div{display:flex;justify-content:space-between;font-size:13px;padding:2px 0;gap:10px}
.bagian-h{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--accent);margin:18px 0 8px}
/* quiz */
.qbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 12px}
.pill{font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--soft);color:var(--muted)}
.pill.brand{background:var(--brand-soft);color:var(--brand)}
.pill.asli{background:var(--accent-soft);color:var(--accent)}
.pill.pred{background:var(--flag-soft);color:var(--flag)}
.pill.baru{background:var(--good-soft);color:var(--good)}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.timer.low{color:var(--bad)}
.layout{display:grid;grid-template-columns:1fr 260px;gap:16px;align-items:start}
.qcard{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow)}
.qnum{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:8px}
.stem{font-size:16.5px;margin-bottom:16px}
.stem p{margin:0 0 8px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--paper);text-align:left;width:100%;position:relative}
.opt:hover{border-color:var(--brand)}
.opt .L{flex:0 0 28px;height:28px;border-radius:8px;display:grid;place-items:center;font-weight:700;background:var(--soft);font-size:14px}
.opt .T{flex:1;padding-top:2px}
.opt.sel{border-color:var(--brand);background:var(--brand-soft)}
.opt.sel .L{background:var(--brand);color:#fff}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.ok .L{background:var(--good);color:#fff}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt.no .L{background:var(--bad);color:#fff}
.opt.struck .T{text-decoration:line-through;opacity:.5}
.opt .x{flex:0 0 auto;border:none;background:transparent;color:var(--muted);font-size:14px;padding:2px 6px;border-radius:6px}
.opt .x:hover{background:var(--soft)}
.opt.locked{cursor:default}
.qnav{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.qnav .sp{flex:1}
.side{position:sticky;top:76px}
.map{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;max-height:52vh;overflow:auto;padding:2px}
.map button{border:1px solid var(--line);background:var(--paper);border-radius:8px;height:34px;font-size:12.5px;font-weight:600;position:relative}
.map button.ans{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
.map button.ok{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.map button.no{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.map button.cur{outline:2px solid var(--ink);outline-offset:1px}
.map button.fl::after{content:"";position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--flag)}
.legend{display:flex;flex-wrap:wrap;gap:8px;font-size:12px;color:var(--muted);margin:8px 0}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;border:1px solid var(--line);vertical-align:-1px;margin-right:4px}
/* pembahasan */
.expl{margin-top:16px;border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:12px}
.verdict{font-weight:800;font-size:15px;padding:10px 12px;border-radius:12px}
.verdict.ok{background:var(--good-soft);color:var(--good)}
.verdict.no{background:var(--bad-soft);color:var(--bad)}
.verdict.na{background:var(--soft);color:var(--muted)}
.blk h4{margin:0 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.blk .body{font-size:15px}
.optx{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px;font-size:14.5px}
.optx.good{border-color:var(--good);background:var(--good-soft)}
.optx.mine{border-color:var(--bad)}
.optx .h{font-weight:700;margin-bottom:4px}
.optx .h em{font-style:normal;font-size:12px;font-weight:700;padding:1px 7px;border-radius:99px;margin-left:6px}
.optx .h em.g{background:var(--good);color:#fff}
.optx .h em.b{background:var(--bad);color:#fff}
.optx .h em.m{background:var(--soft);color:var(--muted)}
.optx p{margin:2px 0}
.optx p b{color:var(--muted);font-weight:600}
.note{background:var(--warn-soft);border-left:4px solid var(--warn);border-radius:10px;padding:10px 12px;font-size:14.5px}
.tip{background:var(--brand-soft);border-left:4px solid var(--brand);border-radius:10px;padding:10px 12px;font-size:14.5px}
.key{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:14.5px}
.mistake{background:var(--bad-soft);border-left:4px solid var(--bad);border-radius:10px;padding:10px 12px;font-size:14.5px}
/* tabel & gambar dari bank lama */
.lab{margin:12px 0;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--soft);max-width:100%;overflow-x:auto}
.lab-t{font-weight:700;font-size:14px;color:var(--hema)}
.lab-i{font-size:13px;color:var(--muted);margin:2px 0 6px}
.lab-n{font-size:13px;color:var(--warn);margin-top:6px}
.t22{border-collapse:collapse;font-size:15px;min-width:100%}
.t22 th,.t22 td{border-bottom:1px solid var(--line);padding:6px 10px;text-align:left}
.t22 th{font-size:13px;color:var(--muted)}
.t22 .fl{color:var(--bad)}
.tagnew{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--hema-soft);color:var(--hema);vertical-align:2px}
.qimg{display:block;max-width:100%;max-height:360px;width:auto;height:auto;margin:12px 0;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:zoom-in}
.qimg.zoom{max-height:none;width:100%;cursor:zoom-out}
/* hasil */
.score{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.ring{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:26px}
table.rt{width:100%;border-collapse:collapse;font-size:14px}
table.rt th,table.rt td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.rt th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
table.rt td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl-wrap{overflow-x:auto}
.wrong-item{border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--paper)}
.wrong-item>button{width:100%;text-align:left;border:none;background:transparent;padding:12px;display:flex;gap:10px}
.wrong-item .wi-body{padding:0 12px 12px;display:none}
.wrong-item.open .wi-body{display:block}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal-bg.show{display:flex}
.modal{background:var(--paper);border-radius:16px;padding:20px;max-width:420px;width:100%;border:1px solid var(--line)}
.modal h3{margin-bottom:8px}
.hide{display:none!important}
.mob-map{display:none}
@media (max-width:860px){
  .hero{grid-template-columns:1fr}
  .layout{grid-template-columns:1fr}
  .side{display:none;position:static}
  .side.show{display:block}
  .mob-map{display:inline-flex}
  .qcard{padding:16px}
  .map{grid-template-columns:repeat(8,1fr)}
}
@media (max-width:420px){.stats{grid-template-columns:repeat(3,1fr)}.stat b{font-size:18px}.map{grid-template-columns:repeat(6,1fr)}}
kbd{font-family:inherit;font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--soft)}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="logo">Recall <span>UAM 3.2 · 2024</span></div>
  <div class="sp"></div>
  <button class="btn sm ghost" id="homeBtn">Beranda</button>
  <button class="icon-btn" id="themeBtn" title="Ganti tema" aria-label="Ganti tema"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3v18a9 9 0 0 0 0-18z" fill="currentColor"/></svg></button>
</div></header>

<main class="wrap" id="app"></main>

<div class="modal-bg" id="modal"><div class="modal">
  <h3 id="mTitle"></h3><div id="mBody" class="muted"></div>
  <div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn" id="mNo">Batal</button><button class="btn pri" id="mYes">Ya</button></div>
</div></div>

aves (90–100%); di jaringan perifer BMR meningkat, kolesterol rendah, relaksasi refleks Achilles cepat.","k":"Primer: TSH dan fT4 berlawanan arah.","t":"Coretan recall \"TSH ↓, T3 & T4 ↑\" sudah benar.","n":"","tag":"rekon","src":"uam2024","ord":76},{"id":16,"ppt":"ldm","topik":"Recall no. 3, 34","s":"Pada pemeriksaan TTGO, beban glukosa yang dilarutkan dalam 250 cc air adalah:","o":[["75 gram glukosa anhidrat","Standar WHO/ADA untuk dewasa.","Benar."],["56 gram","Bukan dosis standar.","Keliru."],["65 gram","Bukan dosis standar.","Keliru."],["50 gram","Dosis glucose challenge test (skrining DMG satu langkah tanpa puasa).","Bukan TTGO diagnostik standar."],["100 gram","Dosis TTGO 3 jam kriteria lama untuk DMG.","Bukan TTGO standar di slide."]],"a":0,"p":"Slide: 75 g glukosa anhidrat dalam 250–300 mL air, diminum habis < 5 menit, ambil darah jam ke-2. Pada anak: 1,75 g/kgBB (maks. 75 g).","k":"TTGO = 75 g / 250–300 mL / < 5 menit / 2 jam.","t":"Angka 75 adalah jawaban paling sering keluar.","n":"Dosis anak 1,75 g/kgBB adalah pelengkap dari literatur.","tag":"rekon","src":"uam2024","ord":3},{"id":17,"ppt":"ldm","topik":"Recall no. 48","s":"Wanita 50 tahun mengeluh mudah lelah, lemah, sering BAK malam hari, dan sering lapar. Glukosa darah puasa 118 mg/dL. Diagnosis yang paling tepat berdasarkan nilai tersebut adalah:","o":[["Prediabetes","<b>Keterangan:<\/b> GDPT/IFG. GDP 100–125 mg/dL.","Benar: belum mencapai ambang DM (≥ 126)."],["DM tipe 1","Butuh kriteria DM dan bukti defisiensi insulin absolut.","GDP belum memenuhi kriteria DM."],["DM tipe 2","Butuh GDP ≥ 126, GD2PP ≥ 200, HbA1c ≥ 6,5%, atau GDS ≥ 200 + gejala.","Belum terpenuhi."],["Diabetes gestasional","Pada kehamilan.","Tidak sesuai."],["DM tipe lain","Ada penyebab spesifik.","Tidak ada data."]],"a":0,"p":"Walau ada keluhan yang mengarah ke DM, satu nilai GDP 118 baru masuk kategori prediabetes. Langkah berikutnya: periksa GDS/TTGO/HbA1c untuk memastikan.","k":"GDP 100–125 = GDPT.","t":"Hitung angka dulu, baru lihat gejala.","n":"","tag":"asli","src":"uam2024","ord":48},{"id":18,"ppt":"ldm","topik":"Recall no. 82","s":"Wanita 26 tahun mengeluh polifagia, poliuria, dan polidipsia sejak 2 bulan. GDP 118 mg/dL. Hasil ini termasuk ciri:","o":[["Prediabetes","GDP 100–125 mg/dL.","Benar berdasarkan angka GDP."],["DM tipe 1","Perlu kriteria DM terpenuhi.","GDP belum ≥ 126."],["DM tipe 2","Perlu kriteria DM terpenuhi.","GDP belum ≥ 126."],["DM gestasional","Pada kehamilan.","Tidak ada data hamil."],["DM tipe lain","Penyebab spesifik.","Tidak ada data."]],"a":0,"p":"Gejala klasik hanya \"membantu\" bila dipasangkan dengan GDS ≥ 200. Dengan GDP 118, klasifikasinya prediabetes, lalu dikonfirmasi dengan GDS/TTGO/HbA1c karena gejala klasik membuat DM sangat mungkin.","k":"Gejala klasik + GDS ≥ 200 = DM; gejala klasik + GDP 118 = belum memenuhi kriteria DM.","t":"Jangan langsung menyimpulkan DM dari gejala; cocokkan angka dengan tabel.","n":"Di praktik klinis, pasien ini perlu pemeriksaan ulang segera karena gejala klasik. Untuk soal pilihan ganda berdasarkan angka, jawabannya prediabetes.","tag":"asli","src":"uam2024","ord":82},{"id":19,"ppt":"ldm","topik":"Recall no. 45","s":"Cut-off HbA1c untuk diagnosis diabetes melitus adalah:","o":[["6,5%","HbA1c ≥ 6,5% (48 mmol/mol) = diagnosis DM.","Benar."],["5,0%","Nilai normal.","Bukan cut-off."],["5,5%","Masih normal (< 5,7%).","Bukan cut-off."],["6,0%","Rentang prediabetes (5,7–6,4%).","Bukan cut-off DM."],["7,0%","Target pengendalian HbA1c pasien DM (< 7%).","Bukan cut-off diagnosis."]],"a":0,"p":"Rentang slide: normal < 5,7%; prediabetes 5,7–6,4%; DM ≥ 6,5%; target terapi < 7%.","k":"5,7 dan 6,5 adalah dua angka batas; 7 adalah target terapi.","t":"Bedakan \"cut-off diagnosis\" (6,5) dengan \"target terapi\" (7).","n":"Recall menulis soal ini sebagai \"pada normalnya di-cut-off berapa\" dan catatan \"di PPT < 5,6 normalnya\". Batas normal yang benar adalah < 5,7%. Karena opsi 5,7 tidak ada, jawaban yang paling masuk akal adalah cut-off diagnosis DM 6,5%.","tag":"asli","src":"uam2024","ord":45},{"id":20,"ppt":"rinf","topik":"Recall no. 13, 50b","s":"Mekanisme imunologi yang mendasari reaksi kulit pada tes tuberkulin (Mantoux) adalah:","o":[["Hipersensitivitas tipe IV","<b>Keterangan:<\/b> tipe lambat. Th1 → IFN-γ → aktivasi makrofag (tipe IVa); indurasi muncul 48–72 jam.","Benar."],["Hipersensitivitas tipe I","IgE, reaksi cepat.","Tidak sesuai."],["Hipersensitivitas tipe II","IgG terhadap sel.","Tidak sesuai."],["Hipersensitivitas tipe III","Kompleks imun.","Tidak sesuai."],["Reaksi anafilaktik","Bentuk berat tipe I.","Tidak sesuai."]],"a":0,"p":"Slide Respon Imun Non Infeksi: tipe IVa (Th1, IFN-γ, makrofag) contohnya reaksi tuberkulin dan dermatitis kontak.","k":"Tuberkulin = DTH = tipe IV.","t":"Reaksi yang dibaca setelah 2–3 hari → tipe IV.","n":"","tag":"asli","src":"uam2024","ord":13},{"id":21,"ppt":"rinf","topik":"Recall no. 39","s":"Monosit yang berada di hepar (sistem retikuloendotelial) disebut:","o":[["Sel Kupffer","Makrofag hati.","Benar."],["Makrofag alveolar","Makrofag paru.","Lokasi berbeda."],["Histiosit","Makrofag jaringan ikat.","Lokasi berbeda."],["Osteoklas","Makrofag tulang.","Lokasi berbeda."],["Mikroglia","Makrofag otak.","Lokasi berbeda."]],"a":0,"p":"Slide: makrofag berasal dari monosit darah, hidup 60–120 hari di jaringan ikat; histiosit, makrofag alveolar, Kupffer, osteoklas, mikroglia.","k":"Kupffer = hati.","t":"Coretan di file: makrofag (paru), Kupffer (hati), histiosit (jaringan), osteoklas (tulang), mikroglia (otak).","n":"","tag":"asli","src":"uam2024","ord":39},{"id":22,"ppt":"rinf","topik":"Recall no. 54, 80","s":"Sel imun yang bekerja menjembatani sistem imun <b>bawaan (innate)<\/b> dan <b>adaptif<\/b> adalah:","o":[["Sel NK","<b>Keterangan:<\/b> termasuk sel NKT. Pada diagram \"Innate vs Adaptive Immunity\", sel NKT dan sel T γδ berada di perbatasan kedua sistem.","Benar menurut recall."],["Limfosit B","Sel imun adaptif murni.","Tidak menjembatani."],["Makrofag","Imun bawaan; berperan sebagai APC.","Lihat catatan."],["Sel dendritik","Imun bawaan; APC profesional yang mengaktifkan sel T naif.","Lihat catatan."],["Granulosit","Imun bawaan murni.","Tidak menjembatani."]],"a":0,"p":"Diagram klasik (Dranoff, Nat Rev Cancer 2004) yang sering dipakai di slide: innate (makrofag, sel dendritik, sel mast, granulosit, sel NK), adaptif (sel B, sel T), dan di tengahnya sel NKT dan sel T γδ.","k":"Sel di perbatasan innate–adaptif: NKT, T γδ.","t":"Coretan recall \"NK cell / T cell\" merujuk ke sel NKT.","n":"Soal ambigu. Kalau soal menanyakan \"penghubung\" lewat presentasi antigen, jawabannya <b>sel dendritik<\/b> (APC profesional). Kalau mengacu diagram slide yang menempatkan sel di tengah kedua sistem, jawabannya <b>sel NK(T)<\/b>, seperti kunci recall. Baca kalimat soalnya dengan teliti.","tag":"asli","src":"uam2024","ord":54},{"id":23,"ppt":"rinf","topik":"Recall no. 55","s":"Sel yang bekerja pada sistem imun <b>nonspesifik<\/b> (bawaan) adalah:","o":[["Makrofag","Fagosit innate, tersedia sebelum infeksi, tanpa memori.","Benar."],["Limfosit B","Imun adaptif (humoral).","Spesifik."],["Sel plasma","Penghasil antibodi spesifik.","Spesifik."],["Limfosit T sitotoksik","Imun adaptif (seluler).","Spesifik."],["Limfosit T helper","Imun adaptif.","Spesifik."]],"a":0,"p":"Komponen innate: barier fisik/kimia, fagosit (neutrofil, makrofag), sel NK, sel dendritik, komplemen, sel mast.","k":"Innate = cepat, umum, tanpa memori.","t":"Semua limfosit B/T dan sel plasma = adaptif.","n":"","tag":"rekon","src":"uam2024","ord":55},{"id":24,"ppt":"rinf","topik":"Recall no. 56","s":"Pada inflamasi, pattern recognition receptors (PRRs) mengenali pola molekuler tertentu. Pada penyakit <b>non-infeksi<\/b>, aktivasi PRR dipicu oleh:","o":[["DAMPs","<b>Keterangan:<\/b> damage-associated molecular patterns. Molekul dari sel rusak/nekrosis (ATP, HMGB1, asam urat, DNA).","Benar."],["PAMPs","<b>Keterangan:<\/b> pathogen-associated molecular patterns. Dari mikroba (LPS, peptidoglikan).","Itu pada infeksi."],["Imunoglobulin E","Pada alergi tipe I.","Bukan ligan PRR."],["Komplemen C3b","Opsonin.","Bukan ligan PRR."],["MHC kelas I","Presentasi antigen ke CD8.","Bukan ligan PRR."]],"a":0,"p":"Inflamasi steril (trauma, iskemia, gout, autoimun) dipicu DAMPs; inflamasi infeksi dipicu PAMPs.","k":"Infeksi = PAMPs; non-infeksi = DAMPs.","t":"D untuk Damage (kerusakan sel sendiri).","n":"","tag":"rekon","src":"uam2024","ord":56},{"id":25,"ppt":"rinf","topik":"Recall no. 57","s":"Salah satu tanda kardinal inflamasi yang terjadi akibat keluarnya eksudat cairan ke jaringan adalah:","o":[["Tumor","<b>Keterangan:<\/b> pembengkakan. Peningkatan permeabilitas → eksudat → edema.","Benar."],["Rubor","<b>Keterangan:<\/b> kemerahan. Akibat vasodilatasi/hiperemia.","Bukan karena eksudat."],["Kalor","<b>Keterangan:<\/b> panas. Akibat peningkatan aliran darah.","Tidak sesuai."],["Dolor","<b>Keterangan:<\/b> nyeri. Akibat bradikinin, PGE2, dan tekanan.","Tidak sesuai."],["Functio laesa","Hilangnya fungsi.","Tidak sesuai."]],"a":0,"p":"Lima tanda kardinal: rubor, kalor, tumor, dolor, functio laesa (Celsus–Virchow).","k":"Eksudat → tumor (bengkak).","t":"Pasangkan tiap tanda dengan mekanismenya.","n":"","tag":"rekon","src":"uam2024","ord":57},{"id":26,"ppt":"rinf","topik":"Recall no. 17, 58, 79","s":"Mediator kimia inflamasi yang berasal dari protein plasma yang diproduksi di hepar adalah:","o":[["Bradikinin","Dari HMWK plasma (disintesis hati) yang dipecah kalikrein.","Benar."],["Histamin","Dari sel mast, basofil, trombosit.","Mediator yang berasal dari sel."],["Serotonin","Dari trombosit.","Mediator yang berasal dari sel."],["Lisozim","Dari granula neutrofil dan makrofag.","Berasal dari sel."],["Nitric oxide","Dari endotel dan makrofag.","Berasal dari sel."]],"a":0,"p":"Mediator yang berasal dari plasma (prekursornya disintesis hati): sistem kinin (bradikinin), komplemen, sistem koagulasi/fibrinolisis. Mediator dari sel: histamin, serotonin, metabolit asam arakidonat, sitokin, NO.","k":"Mediator dari plasma/hati: kinin, komplemen, koagulasi.","t":"Kalau sumbernya \"hepar\", cari protein plasma (bradikinin, komplemen).","n":"","tag":"asli","src":"uam2024","ord":17},{"id":27,"ppt":"rinf","topik":"Recall no. 59","s":"Mediator kimia berikut yang segera meningkatkan permeabilitas vaskular pada fase awal inflamasi akut adalah:","o":[["Histamin","Amin vasoaktif dari sel mast; kontraksi endotel venula → celah.","Benar."],["Leukotrien B4","Kemotaksis neutrofil.","Bukan peningkat permeabilitas utama."],["IL-8","Kemoatraktan neutrofil.","Tidak sesuai."],["Lipoksin","Antiinflamasi.","Kebalikannya."],["Tromboksan A2","Vasokonstriksi dan agregasi trombosit.","Tidak sesuai."]],"a":0,"p":"Slide: yang meningkatkan permeabilitas = histamin, serotonin, bradikinin, leukotrien C4/D4/E4.","k":"Permeabilitas: histamin, serotonin, bradikinin, LTC4–E4.","t":"Histamin = mediator pertama yang dilepas (preformed).","n":"Recall menduga \"serotonin\". Serotonin memang meningkatkan permeabilitas, tetapi pada manusia histamin adalah mediator utama fase awal. Bila opsinya hanya serotonin, jawaban serotonin juga dibenarkan.","tag":"rekon","src":"uam2024","ord":59},{"id":28,"ppt":"gdm","topik":"Recall no. 78","s":"Pasien DM dengan kebutuhan energi total 2.000 kkal/hari. Menurut slide Tatalaksana Gizi pada DM, kebutuhan karbohidratnya per hari adalah:","o":[["225–325 g/hari","<b>Keterangan:<\/b> 45–65% energi ÷ 4 kkal/g. 2.000 × 45% = 900 kkal = 225 g; 2.000 × 65% = 1.300 kkal = 325 g.","Benar."],["50–100 g/hari","Terlalu rendah.","Slide: pembatasan KH total < 130 g/hari tidak dianjurkan."],["400–500 g/hari","Melebihi 65% energi.","Keliru."],["100–150 g/hari","Dihitung dengan 9 kkal/g (kalori lemak).","Salah faktor konversi."],["900–1.300 g/hari","Lupa membagi kkal dengan 4.","Itu nilai dalam kkal, bukan gram."]],"a":0,"p":"Karbohidrat 4 kkal/g, protein 4 kkal/g, lemak 9 kkal/g. Slide: KH 45–65% total energi (utamakan berserat tinggi), sukrosa ≤ 5% energi, lemak 20–25% (tidak > 30%).","k":"Gram KH = (% KH × total energi) ÷ 4.","t":"Selalu ubah kkal ke gram dengan faktor 4 (KH/protein) atau 9 (lemak).","n":"Soal recall no. 78 berbunyi \"rumus menghitung karbohidrat\", dan coretan di file menulis rumus Harris-Benedict (66 + 13,7 BB + 5 TB − 6,8 U). Rumus itu untuk energi basal laki-laki, bukan karbohidrat. Soal ini direkonstruksi ke perhitungan karbohidrat sesuai slide.","tag":"rekon","src":"uam2024","ord":78},{"id":29,"ppt":"imun","topik":"Recall no. 41","s":"Nekrosis fibrinoid pada arteritis sering ditemukan pada SLE. Mekanisme yang mendasari kelainan ini adalah:","o":[["Hipersensitivitas tipe III","Kompleks imun (anti-dsDNA–DNA) mengendap di dinding pembuluh, mengaktifkan komplemen.","Benar."],["Reaksi anafilaktik","Tipe I.","Tidak sesuai."],["Hipersensitivitas tipe I","IgE.","Tidak sesuai."],["Hipersensitivitas tipe IV","Sel T.","Tidak sesuai."],["Hipersensitivitas tipe II","Antibodi terhadap antigen sel (pada SLE menyebabkan anemia hemolitik autoimun, trombositopenia).","Bukan mekanisme vaskulitis fibrinoid."]],"a":0,"p":"Nekrosis fibrinoid = deposit kompleks imun + fibrin di dinding pembuluh, tampak eosinofilik terang. Slide Respon Imun: SLE (dsDNA, Sm, histon) → deposisi kompleks imun tipe III.","k":"Nekrosis fibrinoid ↔ kompleks imun ↔ tipe III.","t":"Vaskulitis + SLE → tipe III.","n":"","tag":"asli","src":"uam2024","ord":41},{"id":30,"ppt":"hemo","topik":"Recall no. 6, 81","s":"Pasien gagal jantung kongestif mengalami edema tungkai dan efusi. Mekanisme utama yang mendasari edema pada pasien ini adalah:","o":[["Peningkatan tekanan hidrostatik disertai retensi natrium dan air","<b>Keterangan:<\/b> kongesti vena. Curah jantung turun → aliran balik vena terhambat; RAAS dan ADH aktif.","Benar."],["Penurunan tekanan onkotik akibat proteinuria","Mekanisme sindroma nefrotik.","Bukan mekanisme utama gagal jantung."],["Obstruksi limfatik","Limfedema lokal.","Tidak sesuai."],["Peningkatan permeabilitas akibat inflamasi","Edema radang (eksudat).","Tidak sesuai."],["Peningkatan tekanan onkotik plasma","Justru menarik cairan masuk pembuluh.","Kebalikannya."]],"a":0,"p":"Slide: gagal jantung → curah jantung turun → volume arteri efektif turun → RAAS & ADH → retensi Na & air → volume plasma naik → tekanan kapiler naik → transudasi → edema.","k":"Gagal jantung = hidrostatik ↑ (kongesti) + retensi Na.","t":"Coretan recall \"kongesti\" mengarah ke jawaban ini.","n":"Soal recall menyebut \"penumpukan cairan di jantung\". Bila maksudnya cairan di kantong perikardium, istilahnya hidroperikardium. Soal direkonstruksi ke mekanisme edema pada penyakit jantung (sesuai recall no. 81).","tag":"rekon","src":"uam2024","ord":6},{"id":31,"ppt":"hemo","topik":"Recall no. 84","s":"Yang dimaksud dengan edema adalah:","o":[["Meningkatnya cairan di ruang interstisial","Bisa terjadi karena tekanan hidrostatik naik, tekanan onkotik turun, obstruksi limfe, retensi Na, atau inflamasi.","Benar."],["Meningkatnya volume darah setempat karena dilatasi arteriol","Definisi hiperemia.","Tidak sesuai."],["Ekstravasasi darah dari pembuluh","Definisi perdarahan.","Tidak sesuai."],["Penumpukan cairan di dalam sel","Degenerasi hidropik (jejas sel), bukan edema interstisial.","Tidak sesuai."],["Bekuan darah dalam pembuluh","Definisi trombus.","Tidak sesuai."]],"a":0,"p":"Slide: tubuh 60% air (2/3 intrasel, 1/3 ekstrasel, sebagian besar interstisial). Edema dinamai sesuai lokasi: hidrotoraks, hidroperikardium, asites; anasarka = edema berat menyeluruh.","k":"Edema = cairan interstisial ↑.","t":"Pisahkan definisi (apa) dari mekanisme (kenapa).","n":"Recall menjawab dengan mekanisme (\"peningkatan hidrostatik dan penurunan onkotik\"); itu penyebab, bukan definisi.","tag":"rekon","src":"uam2024","ord":84},{"id":32,"ppt":"hemo","topik":"Recall no. 21","s":"Hemostasis terbagi menjadi fase primer dan sekunder. Yang termasuk mekanisme hemostasis <b>sekunder<\/b> adalah:","o":[["Kaskade koagulasi hingga terbentuk fibrin","Faktor jaringan, kompleks fosfolipid, aktivasi trombin, polimerisasi fibrin.","Benar."],["Adhesi trombosit melalui vWF","Hemostasis primer.","Tidak sesuai."],["Agregasi trombosit membentuk sumbat","Hemostasis primer.","Tidak sesuai."],["Vasokonstriksi refleks","Tahap awal (endotelin, refleks neurogenik).","Bukan hemostasis sekunder."],["Pelepasan t-PA dan trombomodulin","Kontraregulasi antitrombosis.","Tidak sesuai."]],"a":0,"p":"Urutan slide: vasokonstriksi → hemostasis primer (sumbat trombosit) → hemostasis sekunder (fibrin) → kontraregulasi antitrombosis.","k":"Primer = trombosit; sekunder = fibrin/koagulasi.","t":"Kata \"fibrin\" atau \"faktor pembekuan\" → sekunder.","n":"","tag":"rekon","src":"uam2024","ord":21},{"id":33,"ppt":"hemo","topik":"Recall no. 23","s":"Faktor pembekuan darah yang mengawali jalur <b>ekstrinsik<\/b> bersama faktor jaringan adalah:","o":[["Faktor VII","Faktor jaringan (tromboplastin) + VIIa mengaktifkan faktor X.","Benar."],["Faktor XII","<b>Keterangan:<\/b> Hageman. Awal jalur intrinsik.","Tidak sesuai."],["Faktor VIII","Jalur intrinsik (kofaktor IXa).","Tidak sesuai."],["Faktor IX","Jalur intrinsik.","Tidak sesuai."],["Faktor XIII","Menstabilkan fibrin (ikatan silang).","Tidak sesuai."]],"a":0,"p":"Jalur ekstrinsik dinilai dengan PT; intrinsik dengan aPTT. Faktor VII punya waktu paruh terpendek, sehingga PT paling cepat memanjang pada defisiensi vitamin K/warfarin.","k":"Ekstrinsik = TF + VII (PT); intrinsik = XII, XI, IX, VIII (aPTT).","t":"\"Ekstrinsik = Tujuh\" (eks-TUJUH).","n":"","tag":"rekon","src":"uam2024","ord":23},{"id":34,"ppt":"hemo","topik":"Recall no. 40","s":"Komponen yang mempunyai peranan penting dalam hemostasis adalah:","o":[["Endotel pembuluh darah","Utuh: antitrombotik; setelah jejas: protrombotik (vWF, faktor jaringan).","Benar."],["Eosinofil","Berperan pada alergi dan parasit.","Tidak sesuai."],["Tunika media","Otot polos untuk vasokonstriksi, tetapi bukan komponen utama di slide.","Kurang tepat."],["Tunika adventisia","Jaringan ikat luar.","Tidak sesuai."],["Matriks ekstraseluler","Terpapar saat jejas untuk adhesi trombosit, tetapi pengatur utamanya endotel.","Kurang tepat."]],"a":0,"p":"Slide: hemostasis dan trombosis bergantung pada dinding pembuluh darah (endotel), trombosit, dan kaskade pembekuan.","k":"Tiga pilar: endotel, trombosit, faktor koagulasi.","t":"Pilih komponen dinding yang langsung bersentuhan dengan darah: endotel.","n":"","tag":"asli","src":"uam2024","ord":40},{"id":35,"ppt":"ftr","topik":"Recall no. 18","s":"Obat yang digunakan untuk menurunkan sintesis hormon pada hipertiroidisme adalah:","o":[["Propiltiourasil dan metimazol","<b>Keterangan:<\/b> PTU; tiamazol. Tionamida, menghambat tiroid peroksidase.","Benar."],["Levotiroksin","Terapi hipotiroidisme.","Kebalikannya."],["Kalsitriol","Vitamin D aktif.","Tidak sesuai."],["Prednison","Glukokortikoid.","Bukan OAT utama."],["Furosemid","Diuretik loop.","Tidak sesuai."]],"a":0,"p":"PTU dipilih pada kehamilan trimester I dan krisis tiroid (juga menghambat konversi T4→T3 perifer); metimazol pada umumnya (sekali sehari, risiko hepatotoksik lebih rendah).","k":"OAT = PTU, metimazol, karbimazol.","t":"Coretan recall \"PTU & metimazol\" sudah benar.","n":"","tag":"rekon","src":"uam2024","ord":18},{"id":36,"ppt":"ftr","topik":"Recall no. 75","s":"Pasien hipotiroid yang minum levotiroksin (LT4) dianjurkan tidak meminumnya bersamaan dengan suplemen kalsium atau zat besi. Alasannya adalah:","o":[["Kalsium dan besi mengikat levotiroksin di usus sehingga absorpsinya menurun","Interaksi farmakokinetik (kelasi/adsorpsi).","Benar."],["Levotiroksin merusak suplemen","Keliru.","Tidak sesuai."],["Kombinasi menyebabkan hipertiroid","Keliru.","Justru kadar LT4 turun."],["Suplemen meningkatkan metabolisme LT4 di hati","Itu efek penginduksi enzim (rifampisin, fenitoin).","Bukan mekanisme kalsium/besi."],["Suplemen menghambat sekresi TSH","Keliru.","Tidak sesuai."]],"a":0,"p":"Levotiroksin diminum pagi saat perut kosong, 30–60 menit sebelum makan, dan dipisah ± 4 jam dari kalsium, besi, antasida, sukralfat, atau kolestiramin.","k":"LT4: perut kosong, pisahkan dari Ca, Fe, antasida.","t":"\"Mengganggu penyerapan\" (seperti coretan recall) = jawaban.","n":"","tag":"rekon","src":"uam2024","ord":75},{"id":37,"ppt":"ster","topik":"Recall no. 42","s":"Obat kortikosteroid memiliki efek glukokortikoid dan mineralokortikoid. Efek <b>mineralokortikoid<\/b> dari penggunaan kortikosteroid adalah:","o":[["Hipokalemia","Retensi Na⁺ dan sekresi K⁺ di tubulus distal.","Benar."],["Osteoporosis","Efek glukokortikoid (hambat osteoblas, kurangi absorpsi Ca).","Bukan mineralokortikoid."],["Imunosupresi","Efek glukokortikoid.","Bukan mineralokortikoid."],["Mempercepat pematangan tulang","Bukan efek khas; steroid justru menghambat pertumbuhan anak.","Tidak tepat."],["Muncul akne","Efek dermatologik glukokortikoid/androgenik.","Bukan mineralokortikoid."]],"a":0,"p":"Efek mineralokortikoid: retensi natrium dan air (edema, hipertensi), hipokalemia, alkalosis metabolik. Paling kuat pada fludrokortison dan hidrokortison; deksametason hampir tanpa efek mineralokortikoid.","k":"Mineralokortikoid = Na naik, K turun, air tertahan.","t":"Pilih opsi yang berhubungan dengan elektrolit.","n":"","tag":"asli","src":"uam2024","ord":42},{"id":38,"ppt":"ster","topik":"Recall no. 46","s":"Glukokortikoid adalah hormon pengendali stres. Bila stres berlangsung terlalu lama sehingga glukokortikoid berlebihan, akibat yang dapat terjadi adalah:","o":[["Depresi","Slide Steroid: ESO neuropsikiatrik berupa depresi pada pemakaian jangka panjang.","Benar menurut recall dan slide."],["Hipotensi","Ciri defisiensi kortisol (Addison).","Kebalikannya."],["Hiperkalemia","Ciri defisiensi aldosteron.","Kortisol berlebih justru cenderung hipokalemia."],["Hipovolemia","Ciri insufisiensi adrenal.","Kortisol berlebih menyebabkan retensi cairan."],["Hipertensi","Juga terjadi pada kortisol berlebih, tetapi slide menyebut hipertensi terutama pada dosis tinggi.","Lihat catatan: opsi ini juga bisa dibenarkan."]],"a":0,"p":"Kortisol berlebih kronik memengaruhi hipokampus dan neurotransmiter sehingga timbul gangguan mood (depresi), di samping efek metabolik.","k":"Kortisol berlebih jangka panjang: depresi, hipertensi, hiperglikemia, osteoporosis.","t":"Kata \"stres\" dan \"jangka panjang\" mengarah ke efek neuropsikiatrik.","n":"Soal ini ambigu: hipertensi juga akibat kortisol berlebih (Cushing). Recall memilih <b>depresi<\/b>, dan slide Steroid mencantumkan depresi sebagai efek jangka panjang, sedangkan hipertensi disebut \"hanya terjadi pada pemberian dosis tinggi\". Kalau di ujian pilihannya sama persis, depresi lebih aman.","tag":"asli","src":"uam2024","ord":46},{"id":39,"ppt":"ado","topik":"Recall no. 83","s":"Pasien DM tipe 2 diberi obat yang menurunkan kadar glukosa postprandial dengan menghambat pemecahan karbohidrat di usus halus. Obat tersebut adalah:","o":[["Akarbose","<b>Keterangan:<\/b> penghambat α-glukosidase. Menghambat enzim α-glukosidase di brush border sehingga absorpsi glukosa melambat.","Benar."],["Metformin","Menurunkan produksi glukosa hati, meningkatkan sensitivitas insulin.","Bukan di saluran cerna."],["Glibenklamid","Sulfonilurea, merangsang sekresi insulin.","Bukan di saluran cerna."],["Pioglitazon","Tiazolidindion, agonis PPAR-γ.","Bukan di saluran cerna."],["Dapagliflozin","Penghambat SGLT2 di tubulus proksimal ginjal.","Bekerja di ginjal."]],"a":0,"p":"Efek samping akarbose: flatulens, kembung, diare karena karbohidrat yang tidak tercerna difermentasi bakteri kolon. Bila hipoglikemia terjadi pada kombinasi dengan sulfonilurea/insulin, atasi dengan glukosa murni, bukan sukrosa.","k":"Penghambat α-glukosidase = akarbose, miglitol; target glukosa postprandial.","t":"\"Saluran cerna\" + \"pemecahan karbohidrat\" = akarbose.","n":"","tag":"rekon","src":"uam2024","ord":83},{"id":40,"ppt":"ktp","topik":"Recall no. 8","s":"Pasien tirotoksikosis datang dengan takikardia. Dokter memberikan obat untuk mengurangi takikardia tersebut. Jenis obat yang diberikan adalah:","o":[["Antagonis β-adrenergik","<b>Keterangan:<\/b> propranolol. Memblok efek simpatis; propranolol juga menghambat konversi T4→T3 perifer.","Benar."],["Agonis α-adrenergik","Vasokonstriktor/antihipertensi sentral.","Tidak menurunkan takikardia tirotoksik."],["Agonis β-adrenergik","Menaikkan denyut jantung.","Kebalikannya."],["Antagonis α-adrenergik","Vasodilator, bisa memicu refleks takikardia.","Tidak sesuai."],["Agonis muskarinik","Efek parasimpatis; tidak dipakai untuk takikardia.","Tidak sesuai."]],"a":0,"p":"Propranolol = terapi simptomatik tirotoksikosis (palpitasi, tremor, cemas), bukan penurun sintesis hormon.","k":"Takikardia → β-bloker.","t":"Beta-1 ada di jantung; blok beta = denyut turun.","n":"","tag":"asli","src":"uam2024","ord":8},{"id":41,"ppt":"sm","topik":"Recall no. 4, 33","s":"Apolipoprotein utama pada LDL yang dikenali reseptor LDL sehingga LDL dapat diambil oleh sel adalah:","o":[["Apolipoprotein B","<b>Keterangan:<\/b> B-100. Satu molekul per partikel LDL, ligan reseptor LDL.","Benar."],["Apolipoprotein A","Apo A-I adalah protein utama HDL, mengaktifkan LCAT.","Bukan ligan reseptor LDL."],["Apolipoprotein C","Apo C-II mengaktifkan lipoprotein lipase.","Bukan ligan reseptor LDL."],["Apolipoprotein D","Apolipoprotein minor pada HDL.","Tidak sesuai."],["Apolipoprotein E","Ligan reseptor untuk sisa kilomikron dan IDL.","Bukan untuk LDL."]],"a":0,"p":"Apo B-48 ada pada kilomikron (usus), Apo B-100 pada VLDL, IDL, LDL (hati). Apo B menjadi target terapi (< 90 mg/dL pada DM).","k":"LDL = Apo B-100; HDL = Apo A-I; aktivator LPL = Apo C-II; sisa kilomikron = Apo E.","t":"Bila soal menyebut \"LDL\" atau \"reseptor LDL\", jawab Apo B.","n":"Kalimat recall (\"yang mengikat lipoprotein itu apa\") tidak lengkap. Soal direkonstruksi ke konsep yang paling mungkin ditanyakan, dengan kunci recall Apo B.","tag":"rekon","src":"uam2024","ord":4},{"id":42,"ppt":"sm","topik":"Recall no. 30, 71","s":"Jenis lipoprotein yang paling banyak terdapat dalam plasma (pada keadaan puasa) adalah:","o":[["LDL","Pembawa utama kolesterol plasma (± 60–70% kolesterol total).","Benar."],["Kilomikron","Lipoprotein terbesar, membawa lemak makanan; hilang dari plasma 12–14 jam setelah puasa.","Paling besar ukurannya, bukan paling banyak."],["VLDL","Pembawa trigliserida endogen.","Jumlahnya lebih sedikit dari LDL."],["HDL","Pembawa kolesterol balik ke hati (± 20–30%).","Lebih sedikit dari LDL."],["IDL","Perantara VLDL → LDL, kadarnya sangat rendah.","Tidak sesuai."]],"a":0,"p":"Bedakan \"paling besar\" (kilomikron) dan \"paling banyak di plasma\" (LDL).","k":"Terbesar & paling ringan = kilomikron; terbanyak membawa kolesterol = LDL; terpadat/terkecil = HDL.","t":"Perhatikan kata kunci ukuran vs jumlah.","n":"<b>Koreksi kunci recall:<\/b> no. 30 menulis kilomikron, padahal coretan di file sudah membetulkan menjadi \"LDL yang benar\" (dan no. 71 menandai LDL). Kunci yang benar LDL.","tag":"asli","src":"uam2024","ord":30},{"id":43,"ppt":"cush","topik":"Recall no. 1, 47","s":"Manakah bagian dari glandula suprarenalis yang menghasilkan hormon glukokortikoid?","o":[["Korteks pars fasciculata","Zona tengah korteks adrenal, dirangsang ACTH, menghasilkan kortisol.","Benar."],["Korteks pars glomerulosa","Zona terluar, menghasilkan mineralokortikoid (aldosteron).","Bukan glukokortikoid."],["Korteks pars reticularis","Zona terdalam korteks, menghasilkan androgen adrenal (DHEA).","Bukan glukokortikoid."],["Medulla","Menghasilkan katekolamin (epinefrin, norepinefrin).","Bukan steroid."],["Korteks renalis","Bagian ginjal, bukan adrenal.","Organ yang berbeda."]],"a":0,"p":"Urutan korteks adrenal dari luar ke dalam: glomerulosa (garam/aldosteron) → fasikulata (gula/kortisol) → retikularis (seks/androgen).","k":"GFR = Garam, Fasikulata-gula, Retikularis-seks.","t":"\"Makin dalam makin manis\": glomerulosa garam, fasikulata gula, retikularis seks.","n":"","tag":"asli","src":"uam2024","ord":1},{"id":44,"ppt":"cush","topik":"Recall no. 49","s":"Obat kortikosteroid merupakan bentuk sintetis dari hormon steroid yang dihasilkan glandula suprarenalis. Bagian yang menghasilkan hormon <b>mineralokortikoid<\/b> adalah:","o":[["Korteks pars glomerulosa","Menghasilkan aldosteron, dirangsang angiotensin II dan kalium.","Benar."],["Korteks pars fasciculata","Menghasilkan kortisol.","Bukan mineralokortikoid."],["Korteks pars reticularis","Menghasilkan androgen adrenal.","Bukan mineralokortikoid."],["Medulla","Menghasilkan katekolamin.","Bukan steroid."],["Korteks renalis","Bagian ginjal.","Bukan adrenal."]],"a":0,"p":"Aldosteron bekerja di tubulus distal/duktus koligens: reabsorpsi Na⁺, sekresi K⁺ dan H⁺.","k":"Glomerulosa = aldosteron.","t":"Mineralokortikoid = \"mineral\" (Na, K) = zona terluar.","n":"","tag":"asli","src":"uam2024","ord":49},{"id":45,"ppt":"cush","topik":"Recall no. 50, 84","s":"Korteks adrenal tersusun atas zona glomerulosa, fasikulata, dan retikularis. Hormon yang diproduksi zona <b>retikularis<\/b> adalah:","o":[["Dehidroepiandrosteron","<b>Keterangan:<\/b> DHEA. Androgen adrenal utama.","Benar."],["Aldosteron","Produk zona glomerulosa.","Bukan retikularis."],["Kortisol","Produk utama zona fasikulata.","Bukan retikularis (sebagian kecil saja)."],["Epinefrin","Produk medula adrenal.","Bukan korteks."],["Kortikosteron","Prekursor di jalur mineralokortikoid/glukokortikoid.","Bukan produk khas retikularis."]],"a":0,"p":"Pada sindrom Cushing ACTH-dependent dan hiperplasia adrenal kongenital, androgen adrenal meningkat sehingga muncul hirsutisme dan akne.","k":"Retikularis = androgen (DHEA, DHEA-S, androstenedion).","t":"Soal \"androgen\" (no. 84 recall) jawabannya sama: zona retikularis.","n":"","tag":"asli","src":"uam2024","ord":50},{"id":46,"ppt":"cush","topik":"Recall no. 36","s":"Pemeriksaan laboratorium hormon sebaiknya menyesuaikan irama sirkadian hormon tersebut. Kadar kortisol akan berada di puncak pada waktu:","o":[["Pagi hari","Puncak kortisol sekitar pukul 06.00–08.00, terendah tengah malam.","Benar."],["Sepanjang hari sama","Keliru.","Kortisol bersifat diurnal."],["Siang hari","Kadar sudah menurun.","Bukan puncak."],["Sore hari","Kadar rendah.","Bukan puncak."],["Malam hari","Titik terendah (nadir) sekitar tengah malam.","Kebalikannya."]],"a":0,"p":"Hilangnya nadir kortisol tengah malam adalah salah satu tanda sindrom Cushing. Itulah sebabnya pemeriksaan GDP juga dianjurkan pagi hari (meminimalkan variasi kortisol).","k":"Kortisol: puncak pagi, nadir tengah malam.","t":"Hormon \"bangun tidur\" = kortisol.","n":"","tag":"asli","src":"uam2024","ord":36},{"id":47,"ppt":"add","topik":"Recall no. 15","s":"Laki-laki 50 tahun dalam beberapa bulan merasa lemah, letih, lesu, kadang nyeri perut, dan ruas jari tangan serta bibirnya berwarna lebih gelap. Bagian adrenal yang predominan bertanggung jawab terhadap sintesis glukokortikoid adalah:","o":[["Zona fasikulata","Sumber utama kortisol yang kurang pada penyakit Addison.","Benar."],["Zona glomerulosa","Sumber aldosteron.","Bukan glukokortikoid."],["Zona retikularis","Sumber androgen.","Bukan glukokortikoid."],["Medula","Sumber katekolamin.","Bukan steroid."],["Korteks adrenal","<b>Keterangan:<\/b> keseluruhan. Benar secara umum, tetapi soal menanyakan bagian predominan.","Kurang spesifik dibanding zona fasikulata."]],"a":0,"p":"Kasusnya penyakit Addison: lemas, nyeri perut, hiperpigmentasi lipatan jari dan mukosa bibir (ACTH/MSH tinggi karena kortisol rendah).","k":"Hiperpigmentasi + lemas + nyeri perut = Addison; glukokortikoid = fasikulata.","t":"Pilih jawaban paling spesifik (zona) daripada yang umum (korteks).","n":"","tag":"asli","src":"uam2024","ord":15},{"id":48,"ppt":"add","topik":"Recall no. 37","s":"Manifestasi klinis yang terjadi akibat <b>kekurangan<\/b> hormon yang dihasilkan korteks adrenal zona fasikulata adalah:","o":[["Penyakit Addison","Insufisiensi adrenal primer dengan defisiensi kortisol (± aldosteron).","Benar."],["Sindrom Conn","Hiperaldosteronisme primer (kelebihan hormon zona glomerulosa).","Kelebihan, dan zonanya berbeda."],["Sindrom Bartter","Tubulopati ginjal (defek kotransporter Na-K-2Cl di ansa Henle) dengan hipokalemia.","Bukan defisiensi hormon adrenal."],["Sindrom Gitelman","Tubulopati ginjal (defek kotransporter NaCl tubulus distal).","Bukan defisiensi hormon adrenal."],["Hiperplasia adrenal kongenital","Defek enzim (tersering 21-hidroksilase) dengan kortisol turun dan androgen naik.","Memang ada defisiensi kortisol, tetapi manifestasi yang ditanyakan adalah penyakit defisiensi kortisol klasik, yaitu Addison."]],"a":0,"p":"Hormon zona fasikulata = kortisol. Defisiensinya = insufisiensi adrenal (Addison).","k":"Kurang kortisol → Addison; kelebihan kortisol → Cushing.","t":"Conn = kelebihan aldosteron; Bartter/Gitelman = penyakit tubulus ginjal.","n":"HAK juga menyebabkan defisiensi kortisol; bila muncul sebagai opsi bersama Addison, pilih Addison sebagai jawaban paling tepat untuk \"kekurangan hormon zona fasikulata\".","tag":"asli","src":"uam2024","ord":37},{"id":49,"ppt":"kfr","topik":"Recall no. 9","s":"Pasien pascastroke menjalani fisioterapi. Menurut slide, tujuan/manfaat terapi fisik (fisioterapi) adalah berikut ini, <b>KECUALI<\/b>:","o":[["Menyembuhkan penyebab dasar stroke","Bukan tujuan fisioterapi.","Benar sebagai jawaban."],["Menghilangkan atau mengurangi nyeri","Tujuan fisioterapi.","Bukan jawaban."],["Mencegah dan mengoreksi kecacatan","Tujuan fisioterapi.","Bukan jawaban."],["Memperbaiki sirkulasi darah","Tujuan fisioterapi.","Bukan jawaban."],["Memulihkan kekuatan, mobilitas, dan koordinasi","Tujuan fisioterapi.","Bukan jawaban."]],"a":0,"p":"Fisioterapi: pengobatan fisik dengan perantaraan unsur fisika (panas, dingin, air, arus listrik), pemijatan, manipulasi, dan latihan.","k":"Fisioterapi = mengembalikan fungsi, bukan menyembuhkan penyakit dasar.","t":"Coretan recall \"memulihkan fungsi otot\" termasuk tujuan fisioterapi.","n":"Recall tidak menyertakan opsi; soal direkonstruk memulai jalur ekstrinsik.","Bukan fibrinolisis."]],"a":0,"p":"Fibrinolisis: plasminogen → (t-PA/u-PA) → plasmin → memecah fibrin menjadi FDP/D-dimer. Dikendalikan PAI-1 dan α2-antiplasmin.","k":"Komponen fibrinolisis: plasminogen, plasmin, t-PA, PAI-1, α2-antiplasmin.","t":"Pilih satu-satunya opsi yang mengandung kata \"plasmin\".","n":"Komponen utama fibrinolisis sebenarnya plasmin(ogen) dan t-PA. Kalau di ujian muncul opsi \"plasmin\" atau \"plasminogen\", pilih itu.","tag":"asli","src":"uam2024","ord":24},{"id":53,"ppt":"lain","topik":"Recall no. 5","s":"Untuk menghindari kesalahan pembelahan, sel memiliki mekanisme checkpoint. Checkpoint utama yang memastikan DNA tidak rusak sebelum sel memasuki fase sintesis terletak pada:","o":[["Akhir G1","Checkpoint G1/S (restriction point), diatur p53 dan Rb; DNA rusak → sel berhenti di G1 untuk diperbaiki atau apoptosis.","Benar menurut kunci recall."],["Akhir G0","G0 adalah fase istirahat, bukan checkpoint.","Tidak sesuai."],["Akhir mitosis","Bukan checkpoint klasik.","Tidak sesuai."],["Akhir sintesis","Checkpoint intra-S ada, tetapi bukan jawaban utama.","Kurang tepat."],["Awal mitosis","Checkpoint G2/M, juga, memeriksa DNA sudah tereplikasi sempurna.","Lihat catatan."]],"a":0,"p":"Checkpoint siklus sel: G1/S (paling penting, terkait p53/Rb), G2/M, dan spindle (metafase–anafase). Mutasi p53 menghilangkan G1/S checkpoint sehingga sel dengan DNA rusak terus membelah (dasar karsinogenesis).","k":"G1/S = restriction point, dijaga p53 & Rb.","t":"Bila hanya boleh satu, pilih G1/S.","n":"Soal recall asli menanyakan \"di mana saja\" checkpoint terjadi. Awal mitosis (G2/M) juga benar. Penulis recall awalnya menandai \"awal mitosis\", lalu membetulkan menjadi \"akhir G1\". Kalau soal di ujian memungkinkan dua jawaban, keduanya checkpoint.","tag":"asli","src":"uam2024","ord":5},{"id":54,"ppt":"lain","topik":"Recall no. 7","s":"Neoplasma ovarium yang tersusun dari dua atau lebih lapisan embrional (ektoderm, mesoderm, endoderm), mis <script>

var PIDX={}; PPTS.forEach(function(p,i){PIDX[p.id]=i;});
var LP={sel:{},src:"all",tag:"all",n:"20",order:"rnd"};

try{ if(ST.lp){ for(var k2 in ST.lp) if(k2!=="sel") LP[k2]=ST.lp[k2]; if(ST.lp.sel) PPTS.forEach(function(p){ if(p.id in ST.lp.sel) LP.sel[p.id]=!!ST.lp.sel[p.id]; }); } }catch(e){}
function lpPool(){
  return QS.filter(function(q){
    if(!LP.sel[q.ppt]) return false;
    if(LP.tag!=="all" && (q.tag||"")!==LP.tag) return false;
    var s=stat(q.id);
    if(LP.src==="new") return !s;
    if(LP.src==="wrong") return s&&s.last===0;
    if(LP.src==="flag") return !!ST.flags[q.id];
    return true;
  });
}

  };

function saveSess(){
  if(!S||S.mode!=="practice") return;
  if(S.done){ delete ST.sess; save(); return; }
  ST.sess={title:S.title,ids:S.items.map(function(x){return x.q.id;}),ord:S.items.map(function(x){return x.ord;}),ans:S.items.map(function(x){return x.ans;}),cur:S.cur,t0:S.t0};
  save();
}
function resumeSess(){
  var r=ST.sess; if(!r) return;
  var items=[];
  r.ids.forEach(function(id,i){ var q=QBY[id]; if(!q) return; var ord=r.ord[i]; if(!ord||ord.length!==q.o.length) ord=q.o.map(function(_,k){return k;});
    items.push({q:q,ord:ord,ans:(r.ans[i]==null?null:r.ans[i]),struck:{},fl:!!ST.flags[id]}); });
  if(!items.length){delete ST.sess;save();home();return;}
  S={mode:"practice",title:r.title,items:items,cur:Math.min(r.cur||0,items.length-1),done:false,t0:r.t0||Date.now()};
  quiz(); window.scrollTo(0,0);
}

var S=null, TIMER=null;
function makeItems(list,shuf){
  return list.map(function(q){ var ord=q.o.map(function(_,i){return i;}); if(shuf) shuffle(ord); return {q:q,ord:ord,ans:null,struck:{},fl:!!ST.flags[q.id]}; });
}
function startPractice(list,title,shuf){
  if(!list.length) return;
  S={mode:"practice",title:title,items:makeItems(list,true),cur:0,done:false,t0:Date.now()};
  quiz(); window.scrollTo(0,0);
}
function startExam(){
  var ids=PPTS.filter(function(p){return examSel[p.id];}).map(function(p){return p.id;});
  if(!ids.length){ask("Belum ada PPT dipilih","Pilih minimal satu PPT untuk simulasi.",null,"Oke");return;}
  var pool={},total=0;
  ids.forEach(function(id){pool[id]=shuffle(QS.filter(function(q){return q.ppt===id;}));total+=pool[id].length;});
  var nSel=$("exN").value, N=nSel==="all"?total:Math.min(parseInt(nSel,10),total);
  // alokasi proporsional terhadap jumlah soal tiap PPT (metode sisa terbesar), minimal 1 bila N cukup
  var alloc={},rem=[],used=0;
  ids.forEach(function(id){var x=N*pool[id].length/total; alloc[id]=Math.floor(x); rem.push([id,x-alloc[id]]); used+=alloc[id];});
  if(N>=ids.length) ids.forEach(function(id){ if(alloc[id]===0){alloc[id]=1;used++;} });
  rem.sort(function(a,b){return b[1]-a[1];});
  var i=0; while(used<N && i<rem.length*3){var id=rem[i%rem.length][0]; if(alloc[id]<pool[id].length){alloc[id]++;used++;} i++;}
  while(used>N){var mx=ids.reduce(function(a,b){return alloc[a]>=alloc[b]?a:b;}); alloc[mx]--; used--;}
  var list=[]; ids.forEach(function(id){list=list.concat(pool[id].slice(0,alloc[id]));});
  shuffle(list);
  var per=parseInt($("exT").value,10);
  S={mode:"exam",title:"Simulasi recall UAM 3.2 2024",items:makeItems(list,true),cur:0,done:false,t0:Date.now(),limit:per?per*list.length:0};
  quiz(); window.scrollTo(0,0);
  if(S.limit) startTimer();
}
function startTimer(){
  stopTimer();
  TIMER=setInterval(function(){
    if(!S||S.done){stopTimer();return;}
    var left=S.limit-Math.floor((Date.now()-S.t0)/1000);
    var el=$("tmr"); if(el){el.textContent=fmt(Math.max(left,0)); el.classList.toggle("low",left<=60);}
    if(left<=0){stopTimer(); finishExam(true);}
  },1000);
}
function stopTimer(){ if(TIMER){clearInterval(TIMER);TIMER=null;} }
function fmt(s){var m=Math.floor(s/60),x=s%60;return (m<10?"0":"")+m+":"+(x<10?"0":"")+x;}

        if(i===S.cur) c+=" cur"; if(x.fl) c+=" fl";
        return '<button class="'+c+'" data-go="'+i+'">'+(i+1)+'</button>';}).join('')+'</div>'+
     '<div class="small muted" style="margin-top:8px">'+(exam&&!S.done?'Kunci & pembahasan tampil setelah ujian dikirim.':'')+'</div></div></aside></div>';
  $("app").innerHTML=h;
  saveSess();
  bindQuiz();
}
function bindQuiz(){
  var it=S.items[S.cur], exam=S.mode==="exam";
  $("app").onclick=function(e){
    var x=e.target.closest("[data-x]");
    if(x){ e.stopPropagation(); var oi=+x.getAttribute("data-x"); it.struck[oi]=!it.struck[oi]; quiz(); return; }
    var o=e.target.closest("[data-o]");
    if(o){ choose(+o.getAttribute("data-o")); return; }
    var g=e.target.closest("[data-go]");
    if(g){ S.cur=+g.getAttribute("data-go"); quiz(); window.scrollTo(0,0); return; }
    var wi=e.target.closest(".wi-head"); if(wi){wi.parentNode.classList.toggle("open");}
  };
  document.querySelectorAll(".qimg").forEach(function(i){i.onclick=function(){i.classList.toggle("zoom");};});
  $("prevB").onclick=function(){go(-1);};
  $("nextB").onclick=function(){ if(S.cur===S.items.length-1){ endAsk(); } else go(1); };
  $("flagB").onclick=toggleFlag;
  $("endB").onclick=endAsk;
  var mt=$("mapT"); if(mt) mt.onclick=function(){$("side").classList.toggle("show"); $("side").scrollIntoView({behavior:"smooth"});};
}
function go(d){ var n=S.cur+d; if(n<0||n>=S.items.length) return; S.cur=n; quiz(); window.scrollTo(0,0); }
function toggleFlag(){ var it=S.items[S.cur]; it.fl=!it.fl; if(it.fl) ST.flags[it.q.id]=1; else delete ST.flags[it.q.id]; save(); quiz(); }
function choose(oi){
  var it=S.items[S.cur];
  if(S.done) return;
  if(S.mode==="practice"){
    if(it.ans!==null) return;
    it.ans=oi; record(it.q,oi===it.q.a); save(); quiz();
  } else { it.ans=(it.ans===oi?null:oi); quiz(); }
}
function endAsk(){
  if(S.done){ results(); return; }
  var n=S.items.length, a=S.items.filter(function(x){return x.ans!==null;}).length, f=S.items.filter(function(x){return x.fl;}).length;
  if(S.mode==="exam"){
    ask("Kirim jawaban dan akhiri ujian?",'Dijawab <b>'+a+'</b> dari '+n+' soal'+(n-a?' · <b>'+(n-a)+'</b> belum dijawab':'')+(f?' · <b>'+f+'</b> ditandai ragu':'')+'. Setelah dikirim, jawaban tidak bisa diubah.',function(){finishExam(false);},"Ya, kirim");
  } else {
    if(a<n) ask("Akhiri latihan?",(n-a)+' soal belum dijawab. Hasil dihitung dari soal yang sudah dijawab.',function(){S.done=true;results();},"Akhiri");
    else {S.done=true;results();}
  }
}
function finishExam(timeout){
  stopTimer(); S.done=true; S.timeout=timeout;
  S.items.forEach(function(it){ if(it.ans!==null) record(it.q,it.ans===it.q.a); });
  var ok=S.items.filter(function(x){return x.ans===x.q.a;}).length;
  var d=new Date(), pad=function(x){return (x<10?"0":"")+x;};
  ST.hist.push({date:d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+" "+pad(d.getHours())+":"+pad(d.getMinutes()),n:S.items.length,pct:Math.round(ok/S.items.length*100)});
  if(ST.hist.length>30) ST.hist=ST.hist.slice(-30);
  save(); results();
}

/* ---------- pembahasan ---------- */
function explain(it){
  var q=it.q, mine=it.ans, ok=mine===q.a, kpos=it.ord.indexOf(q.a), h='<div class="expl">';
  if(mine===null) h+='<div class="verdict na">Tidak dijawab. Kunci: '+LET[kpos]+'</div>';
  else h+='<div class="verdict '+(ok?'ok':'no')+'">'+(ok?'Benar! ':'Belum tepat. ')+'Kunci jawaban: '+LET[kpos]+'. '+q.o[q.a][0]+'</div>';
  if(mine!==null&&!ok){ var mp=it.ord.indexOf(mine); h+='<div class="mistake"><b>Kenapa pilihanmu ('+LET[mp]+') keliru:</b> '+q.o[mine][2]+'<br><span class="muted">Faktanya: '+q.o[mine][1]+'</span></div>'; }
  h+='<div class="blk"><h4>Alasan jawaban benar</h4><div class="body">'+q.o[q.a][2]+(q.p?'<div style="margin-top:6px">'+q.p+'</div>':'')+'</div></div>';
  h+='<div class="blk"><h4>Pembahasan semua opsi</h4>';
  it.ord.forEach(function(oi,k){
    var good=oi===q.a, me=oi===mine;
    h+='<div class="optx'+(good?' good':'')+(me&&!good?' mine':'')+'"><div class="h">'+LET[k]+'. '+q.o[oi][0]+(good?'<em class="g">Kunci</em>':'')+(me&&!good?'<em class="b">Pilihanmu</em>':'')+(me&&good?'<em class="m">Pilihanmu</em>':'')+'</div>'+
       '<p><b>Fungsi / faktanya:</b> '+q.o[oi][1]+'</p><p><b>'+(good?'Kenapa jadi jawaban:':'Kenapa bukan jawaban:')+'</b> '+q.o[oi][2]+'</p></div>';
  });
  h+='</div>';
  if(q.k) h+='<div class="key"><b>Poin penting untuk ujian:</b> '+q.k+'</div>';
  if(q.t) h+='<div class="tip"><b>Tips menjawab:</b> '+q.t+'</div>';
  if(q.n) h+='<div class="note"><b>Catatan (slide vs referensi):</b> '+q.n+'</div>';
  h+='</div>';
  return h;
}

/* ================= HASIL ================= */
function results(){
  stopTimer(); location.hash="hasil";
  if(S.mode==="practice"&&ST.sess){ delete ST.sess; save(); }
  var items=S.items, exam=S.mode==="exam";
  var ans=items.filter(function(x){return x.ans!==null;}), ok=items.filter(function(x){return x.ans===x.q.a;}), wrong=ans.filter(function(x){return x.ans!==x.q.a;});
  var denom=exam?items.length:Math.max(ans.length,1), pct=Math.round(ok.length/denom*100);
  var per={}, perT={};
  items.forEach(function(x){
    var k=x.q.ppt; per[k]=per[k]||{n:0,ok:0,blank:0}; per[k].n++; if(x.ans===x.q.a) per[k].ok++; if(x.ans===null) per[k].blank++;
    var tk=x.q.ppt+"||"+x.q.topik; perT[tk]=perT[tk]||{n:0,ok:0}; perT[tk].n++; if(x.ans===x.q.a) perT[tk].ok++;
  });
  var col=pct>=80?'var(--good)':pct>=60?'var(--warn)':'var(--bad)';
  var mins=Math.round((Date.now()-S.t0)/60000);
  var h='<div class="panel"><div class="score"><div class="ring" style="background:conic-gradient('+col+' '+pct*3.6+'deg,var(--soft) 0)"><div style="width:84px;height:84px;border-radius:50%;background:var(--paper);display:grid;place-items:center">'+pct+'%</div></div>'+
        '<div><h2 style="font-size:20px">'+(exam?'Hasil simulasi ujian':'Hasil latihan')+'</h2><div class="muted">'+esc(S.title)+(S.timeout?' · waktu habis':'')+'</div>'+
        '<div class="row" style="margin-top:8px"><span class="pill">'+items.length+' soal</span><span class="pill baru">Benar '+ok.length+'</span><span class="pill" style="background:var(--bad-soft);color:var(--bad)">Salah '+wrong.length+'</span><span class="pill">Kosong '+(items.length-ans.length)+'</span><span class="pill">± '+mins+' menit</span></div></div></div>';
  // rekomendasi
  var weakP=Object.keys(per).map(function(k){return {k:k,v:per[k],r:per[k].ok/per[k].n};}).filter(function(x){return x.r<0.7;}).sort(function(a,b){return a.r-b.r;});
  var weakT=Object.keys(perT).map(function(k){return {k:k,v:perT[k],r:perT[k].ok/perT[k].n};}).filter(function(x){return x.r<0.6&&x.v.n>=2;}).sort(function(a,b){return a.r-b.r;}).slice(0,6);
  h+='<div style="margin-top:14px"><b>Rekomendasi belajar ulang:</b> ';
  if(!weakP.length) h+='<span class="muted">Semua PPT di sesi ini ≥ 70%. Lanjutkan dengan simulasi PPT lain atau tambah jumlah soal.</span>';
  else h+=weakP.map(function(x){return esc(PBY[x.k].title)+' ('+Math.round(x.r*100)+'%)';}).join(', ')+(weakT.length?'. Fokus subtopik: '+weakT.map(function(x){var a=x.k.split("||");return esc(a[1])+' <span class="muted">('+esc(PBY[a[0]].title)+')</span>';}).join(', '):'')+'.';
  h+='</div><div class="row" style="margin-top:14px"><button class="btn pri" id="rvAll">Lihat semua pembahasan</button><button class="btn" id="rvWrong" '+(wrong.length||items.length-ans.length?'':'disabled')+'>Ulangi soal salah & kosong</button><button class="btn" id="rvHome">Ke beranda</button></div></div>';
  // per PPT
  h+='<div class="panel" style="margin-top:14px"><h2>Analisis per PPT</h2><div class="tbl-wrap"><table class="rt"><tr><th>PPT</th><th class="n">Soal</th><th class="n">Benar</th><th class="n">%</th></tr>'+
     Object.keys(per).sort(function(a,b){return per[a].ok/per[a].n-per[b].ok/per[b].n;}).map(function(k){var v=per[k];return '<tr><td>'+esc(PBY[k].title)+'</td><td class="n">'+v.n+'</td><td class="n">'+v.ok+'</td><td class="n"><b style="color:'+(v.ok/v.n>=0.8?'var(--good)':v.ok/v.n>=0.6?'var(--warn)':'var(--bad)')+'">'+Math.round(v.ok/v.n*100)+'%</b></td></tr>';}).join('')+'</table></div></div>';
  h+='<div class="panel" style="margin-top:14px"><h2>Analisis per topik</h2><div class="tbl-wrap"><table class="rt"><tr><th>Topik</th><th>PPT</th><th class="n">Benar</th><th class="n">%</th></tr>'+
     Object.keys(perT).sort(function(a,b){return perT[a].ok/perT[a].n-perT[b].ok/perT[b].n;}).map(function(k){var v=perT[k],a=k.split("||");return '<tr><td>'+esc(a[1])+'</td><td class="muted small">'+esc(PBY[a[0]].title)+'</td><td class="n">'+v.ok+'/'+v.n+'</td><td class="n">'+Math.round(v.ok/v.n*100)+'%</td></tr>';}).join('')+'</table></div></div>';
  // daftar salah
  var bad=items.map(function(x,i){return {x:x,i:i};}).filter(function(o){return o.x.ans!==o.x.q.a;});
  h+='<div class="panel" style="margin-top:14px"><h2>Daftar soal salah & kosong ('+bad.length+')</h2><p class="muted small" style="margin:0 0 10px">Ketuk soal untuk membuka pembahasan lengkap.</p>';
  bad.forEach(function(o){
    var stemTxt=o.x.q.s.replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim();
    h+='<div class="wrong-item"><button class="wi-head"><b>'+(o.i+1)+'.</b><span style="flex:1">'+esc(stemTxt.length>170?stemTxt.slice(0,170)+'…':stemTxt)+'<br><span class="muted small">'+esc(PBY[o.x.q.ppt].title)+' · '+esc(o.x.q.topik)+'</span></span></button><div class="wi-body"><div class="stem">'+o.x.q.s+'</div>'+explain(o.x)+'</div></div>';
  });
  if(!bad.length) h+='<div class="muted">Tidak ada. Mantap!</div>';
  h+='</div>';
  $("app").innerHTML=h;
  $("app").onclick=function(e){var wi=e.target.closest(".wi-head"); if(wi) wi.parentNode.classList.toggle("open");};
  document.querySelectorAll(".qimg").forEach(function(i){i.onclick=function(){i.classList.toggle("zoom");};});
  $("rvAll").onclick=function(){S.cur=0; quiz(); window.scrollTo(0,0);};
  $("rvWrong").onclick=function(){ startPractice(bad.map(function(o){return o.x.q;}),"Ulangi soal salah & kosong",true); };
  $("rvHome").onclick=function(){S=null;home();};
  window.scrollTo(0,0);
}

/* ---------- keyboard ---------- */
document.addEventListener("keydown",function(e){
  if($("modal").classList.contains("show")){ if(e.key==="Escape") $("mNo").click(); if(e.key==="Enter") $("mYes").click(); return; }
  if(!S||location.hash!=="#soal") return;
  if(e.target.tagName==="SELECT"||e.target.tagName==="INPUT") return;
  var k=e.key.toUpperCase(), it=S.items[S.cur];
  var idx=LET.indexOf(k);
  if(idx>=0&&idx<it.ord.length&&k.length===1){ choose(it.ord[idx]); e.preventDefault(); }
  else if(e.key==="ArrowRight") go(1);
  else if(e.key==="ArrowLeft") go(-1);
  else if(k==="F") toggleFlag();
});
window.addEventListener("hashchange",function(){ if(!location.hash && S && !S.done && S.mode==="exam"){ location.hash="soal"; } });
home();
})();
</script>
</body>
</html>
